          const sample = (DEMO.ai || {})[`${c.id}:${taskKey}`];
          if (!sample) throw new Error('No AI answer is cached for this case in demo mode. Switch to live mode and add a Gemini key.');
          return { value: sample.value, grounding: sample.grounding || [], model: sample.model, illustrative: !!sample.illustrative };
        }
        const task = P.AI_TASKS[taskKey];
        const user = P.aiUserText(taskKey, ctx);
        const preview = JSON.stringify(P.buildGeminiBody({ system: `${P.AI_SYSTEM_INSTRUCTIONS}\n\n${task.instruction}`, user, schema: tool ? null : task.schema, tool }), null, 2);
        if (!(await confirmPayload(task.title, preview, tool))) throw new Error('Cancelled before anything was sent.');
        const out = await P.geminiJson(net, { ...settings }, { taskKey, user, tool });
        return { value: out.value, grounding: (out.first && out.first.grounding) || [], model: out.model, illustrative: false };
      }

      function caseContext(r) {
        const caps = r.reference.captures.filter((x) => x.check && x.check.title);
        return { url: r.url, cutoff: selected.value.cutoff, features: r.features, title: caps.length ? caps[caps.length - 1].check.title : '' };
      }

      async function runAiTask(kind, opts = {}) {
        const c = selected.value, r = result.value;
        if (!c || !r || r.running || ui.aiBusy) return;
        const av = aiAvailable();
        if (!av.ok) { ui.aiError = av.why; return; }
        ui.aiBusy = kind; ui.aiError = '';
        r.modules.AI = { state: 'running', message: P.AI_TASKS[kind].title }; bump();
        try {
          if (kind === 'findSources') await aiFindSources(c, r, opts);
          else if (kind === 'queries') await aiQueries(c, r);
          else if (kind === 'match') await aiMatch(c, r);
          else if (kind === 'readArchived') await aiReadArchived(c, r);
          else if (kind === 'summary') await aiSummary(c, r);
          r.modules.AI = { state: 'done', message: `${P.AI_TASKS[kind].title}: finished. AI output is labelled unverified and never counts towards the grade.` };
        } catch (e) {
          ui.aiError = e.raw ? `${e.message} The raw answer is shown under AI assist.` : e.message;
          if (e.raw) r.aiItems.unshift({ id: uid(), kind, failed: true, raw: e.raw, title: P.AI_TASKS[kind].title });
          r.modules.AI = { state: 'failed', message: e.message };
        } finally { ui.aiBusy = ''; bump(); }
      }

      async function aiFindSources(c, r, opts) {
        const res = await aiRequest('findSources', { ...caseContext(r), extra: opts.extra || '' }, settings.useGrounding ? 'search' : null);
        const urls = [...new Set([...res.value.candidates.map((x) => x.url), ...res.grounding.map((g) => g.uri)].filter(Boolean))].slice(0, 8);
        r.aiItems.unshift({ id: uid(), kind: 'findSources', title: P.AI_TASKS.findSources.title, model: res.model, illustrative: res.illustrative,
          candidates: res.value.candidates, grounding: res.grounding });
        bump();
        // Each URL is looked up by the tool itself. Only verified captures can enter the evidence.
        const verified = await P.verifyCandidates(urls, caseDef(c), r, makeEnv(c, textStores.get(c.id) || new Map()));
        r.candidates = [...verified, ...r.candidates.filter((x) => !verified.some((v) => v.url === x.url))];
        P.rebuildSources(r);
        announce(`${verified.filter((v) => v.verified).length} of ${verified.length} AI candidates were verified by the tool.`);
      }

      async function aiQueries(c, r) {
        const res = await aiRequest('queries', caseContext(r), null);
        r.aiItems.unshift({ id: uid(), kind: 'queries', title: P.AI_TASKS.queries.title, model: res.model, illustrative: res.illustrative,
          queries: res.value.queries.map((q) => ({ ...q, href: `https://www.google.com/search?q=${encodeURIComponent(`${q.query} before:${c.cutoff}`)}` })) });
      }

      async function aiMatch(c, r) {
        const ts = textStores.get(c.id) || new Map();
        const checked = r.reference.captures.filter((x) => x.before && x.check && x.check.features && ts.has(x.rawUrl));
        if (!checked.length) throw new Error('No archived text is available yet. Run the check first; the text is kept only while this page is open.');
        const pick = [checked[checked.length - 1], ...checked.filter((x) => x.check.features.some((f) => f.verdict === 'possible'))]
          .filter((v, i, a) => a.indexOf(v) === i).slice(0, 3);
        const { blocks, index, truncated } = P.sentencesForAi(pick, ts, r.features, settings.aiMaxSentences);
        const res = await aiRequest('match', { ...caseContext(r), blocks, truncated }, null);
        const accepted = [], discarded = [];
        for (const m of res.value.matches) {
          if (m.verdict === 'not found') continue;
          if (r.features[m.feature] == null) { discarded.push({ ...m, reason: 'The feature number does not exist.' }); continue; }
          // Try the capture the AI referred to, then every capture it was shown.
          const ref = index.find((x) => x.sid === m.sentence_id);
          const order = ref ? [pick.find((p) => p.rawUrl === ref.rawUrl), ...pick] : pick;
          let hit = null;
          for (const cap of order.filter(Boolean)) {
            const stored = ts.get(cap.rawUrl);
            const chk = P.verifyQuote(m.quote, stored.sentences, ref && ref.rawUrl === cap.rawUrl ? ref.i : null);
            if (chk.ok) { hit = { cap, sentence: chk.sentenceId != null ? stored.sentences[chk.sentenceId] : m.quote }; break; }
          }
          if (hit) accepted.push({ ...m, captureDate: hit.cap.date, sentence: hit.sentence, lexical: P.lexicalScore(r.features[m.feature], hit.sentence).score });
          else { discarded.push({ ...m, reason: 'Not found word for word in the text the tool fetched.' }); logNote(`AI quotation: "${String(m.quote).slice(0, 80)}"`, 'Discarded: not found in the fetched text.'); }
        }
        r.aiItems.unshift({ id: uid(), kind: 'match', title: P.AI_TASKS.match.title, model: res.model, illustrative: res.illustrative, accepted, discarded });
      }

      async function aiReadArchived(c, r) {
        const pre = r.reference.captures.filter((x) => x.before);
        const urls = [pre[0], pre[pre.length - 1]].filter(Boolean).map((x) => x.viewUrl).filter((v, i, a) => a.indexOf(v) === i);
        if (!urls.length) throw new Error('There is no capture before the cut-off for the AI to read.');
        const res = await aiRequest('readArchived', { ...caseContext(r), urls }, 'url');
        r.aiItems.unshift({ id: uid(), kind: 'readArchived', title: P.AI_TASKS.readArchived.title, model: res.model, illustrative: res.illustrative, readings: res.value.readings });
      }

      async function aiSummary(c, r) {
        const g = r.grade;
        const rows = reportRows.value.slice(0, 40).map((x) => ({ label: x.s.label, party: x.s.party, cls: x.s.cls, date: P.isoDate(x.s.date), before: x.s.before, url: x.s.url,
          features: x.feats.join(', ') }));
        const ctx = { ...caseContext(r), grade: g.grade, gradeText: P.GRADE_TEXT[g.grade], reason: g.reason, keyDate: g.keyDate ? P.isoDate(g.keyDate) : '', rows };
        let text;
        if (mode.value === 'demo') {
          const sample = (DEMO.ai || {})[`${c.id}:summary`];
          if (!sample) throw new Error('No AI summary is cached for this case in demo mode.');
          text = sample.text;
        } else {
          const system = `${P.AI_SYSTEM_INSTRUCTIONS}\n\n${P.AI_TASKS.summary.instruction}`;
          const user = P.aiUserText('summary', ctx);
          if (!(await confirmPayload(P.AI_TASKS.summary.title, JSON.stringify(P.buildGeminiBody({ system, user }), null, 2), null))) throw new Error('Cancelled before anything was sent.');
          text = (await P.geminiGenerate(net, { ...settings }, { system, user, label: P.AI_TASKS.summary.title })).text.trim();
        }
        // The draft may only mention URLs and dates that are in the verified table.
        const allowedUrls = rows.map((x) => x.url).concat(r.url ? [r.url] : []);
        const allowedDates = [...rows.map((x) => x.date), c.cutoff, ctx.keyDate].filter(Boolean);
        ui.summaryProblems = P.checkSummaryDraft(text, allowedUrls, allowedDates);
        ui.summaryDraft = ui.summaryProblems.length ? '' : text;
        if (ui.summaryProblems.length) throw new Error('The AI draft was rejected because it mentions facts that are not in the evidence table.');
      }

      /* Run the AI only where a module failed or found nothing (live mode, key present, not confidential). */
      async function autoAi(c, r) {
        if (mode.value !== 'live' || !settings.autoAI || !settings.geminiKey || c.confidential) return;
        const tasks = [];
        const noCaptures = (r.modules.A && r.modules.A.state === 'failed') || !r.reference.captures.some((x) => x.before);
        if (noCaptures) tasks.push(['findSources', {}]);
        else if (r.youtube && r.youtube.status === 'skipped') tasks.push(['findSources', { extra: 'The reference is a YouTube video; find independent mentions of it.' }]);
        else if (r.github && r.github.status === 'rate-limited') tasks.push(['findSources', { extra: 'The reference is a GitHub repository; find independent mentions of it.' }]);
        if (r.reference.needsProxy) tasks.push(['readArchived', {}]);
        if (r.reference.semanticError) tasks.push(['match', {}]);
        if (r.hn && r.hn.status !== 'done' && !r.corroborating.length) tasks.push(['queries', {}]);
        for (const [k, o] of tasks) await runAiTask(k, o);
      }

      /* ---------- Views ---------- */
      function rowsFor(r, filter) {
        if (!r || !r.sources) return [];
        const nF = (r.features || []).length;
        // Listed-but-unread archive captures of the reference stay on the timeline, not in the table.
        let rows = r.sources.filter((s) => s.kind !== 'wayback' || s.role !== 'reference' || (s.capture && s.capture.check));
        if (filter === 'before') rows = rows.filter((s) => s.before);
        if (filter === 'after') rows = rows.filter((s) => !s.before);
        return rows.map((s) => {
          const ov = s.override || (s.capture && s.capture.override) || {};
          return { s, id: P.sourceId(s), feats: Array.from({ length: nF }, (_, i) => P.featureStatusOf(s, i)), over: Array.from({ length: nF }, (_, i) => !!ov[i]) };
        }).sort((a, b) => new Date(a.s.date) - new Date(b.s.date));
      }
      const evidenceRows = computed(() => { version.value; return rowsFor(result.value, ui.evidenceFilter); });
      const reportRows = computed(() => { version.value; return rowsFor(result.value, 'all'); });
      const uncheckedCount = computed(() => { version.value; const r = result.value; return r && r.reference ? r.reference.captures.filter((x) => !x.check).length : 0; });
      const checkedCaptures = computed(() => {
        version.value;
        const r = result.value;
        if (!r || !r.reference) return [];
        return [...r.reference.captures.map((cap) => ({ cap, role: 'Reference page' })),
          ...r.corroborating.flatMap((e) => (e.captures || []).map((cap) => ({ cap, role: `Corroborating page ${e.url}` }))),
          ...(r.candidates || []).filter((x) => x.verified).flatMap((e) => e.captures.map((cap) => ({ cap, role: `AI candidate verified by the tool, ${e.url}` })))]
          .filter((x) => x.cap.check).sort((a, b) => a.cap.ts.localeCompare(b.cap.ts));
      });
      const uncheckedCaptures = computed(() => { version.value; const r = result.value; return r && r.reference ? r.reference.captures.filter((x) => !x.check && x.before) : []; });
      const firstPresent = computed(() => {
        version.value;
        const r = result.value;
        if (!r || !r.reference) return [];
        return features.value.map((f, fi) => r.reference.captures.find((x) => x.before && P.featureStatusOf({ capture: x }, fi) === 'present') || null);
      });
      const timeline = computed(() => { version.value; return result.value && selected.value ? timelineModel(result.value, selected.value.cutoff, ui.zoom, false) : null; });
      const miniTimeline = computed(() => { version.value; return result.value && selected.value ? timelineModel(result.value, selected.value.cutoff, ui.zoom, true) : null; });
      const reportTimeline = computed(() => { version.value; return result.value && selected.value ? timelineModel(result.value, selected.value.cutoff, '5y', false) : null; });
      const overrideCount = computed(() => { version.value; return reportRows.value.reduce((n, r) => n + r.over.filter(Boolean).length, 0); });
      const nearCutoff = computed(() => { version.value; return !!(grade.value && grade.value.keyDate && selected.value && P.isNearCutoff(grade.value.keyDate, selected.value.cutoff)); });
      const runningMessage = computed(() => {
        version.value;
        const r = result.value;
        const m = r && Object.entries(r.modules || {}).find(([, v]) => v.state === 'running');
        return m ? `${m[1].message}…` : 'Starting…';
      });

      function summarise(list) {
        const groups = {};
        for (const s of list) { const k = `${s.party} (${CLASS_TEXT[s.cls] ? CLASS_TEXT[s.cls].toLowerCase() : s.cls})`; groups[k] = (groups[k] || 0) + 1; }
        const parts = Object.entries(groups).map(([k, n]) => `${n} from ${k}`);
        return parts.length ? parts.join(', ') : 'none';
      }
      const countedSummary = computed(() => { version.value; const g = grade.value; return g && g.perFeature[0] ? summarise(g.perFeature[0].counted) : 'none'; });
      const excludedSummary = computed(() => {
        version.value;
        const g = grade.value, r = result.value;
        if (!g || !g.perFeature[0]) return 'none';
        const after = g.perFeature[0].excluded.filter((s) => !s.before).length;
        const aiCount = (r.aiItems || []).filter((x) => x.kind === 'findSources').reduce((n, x) => n + x.candidates.length, 0);
        const unverified = (r.candidates || []).filter((x) => !x.verified).length;
        return [`${after} dated after the cut-off`, aiCount ? `${aiCount} AI suggestion${aiCount === 1 ? '' : 's'} (never counted)` : '', unverified ? `${unverified} AI candidate${unverified === 1 ? '' : 's'} the tool could not verify` : ''].filter(Boolean).join(', ');
      });
      const nextActions = computed(() => {
        version.value;
        const r = result.value, g = grade.value;
        if (!r || r.running || !g) return ['Run the check to see suggestions.'];
        const out = [];
        const possible = r.reference.captures.some((x) => x.before && x.check && x.check.features && x.check.features.some((f) => f.verdict === 'possible'));
        if (possible) out.push('Some captures possibly show a feature. Read them under Feature match and confirm or reject each one.');
        if (g.grade === 'D' && !r.reference.captures.some((x) => x.before)) out.push('Add a corroborating URL, or ask the AI to find other places the content was published.');
        if (g.grade === 'D' && r.reference.captures.some((x) => x.before)) out.push('Check more captures before the cut-off, or rephrase the feature statements in the words the page uses.');
        if (g.grade === 'B') out.push('Add a second, independent source (a corroborating URL or an archived page showing the feature) to reach grade A.');
        if (g.grade === 'C') out.push('Self-reported dates are weak on their own. Look for an archive capture or a third-party post that shows the feature.');
        if (r.type === 'github' && uncheckedCaptures.value.length) out.push('Read an archived capture of the repository page under Feature match: it is an independent date for its README.');
        if (r.leads && r.leads.length) out.push(`Review ${r.leads.length} related Hacker News post${r.leads.length === 1 ? '' : 's'} listed under Evidence.`);
        if (nearCutoff.value) out.push('The key date is within a day of the cut-off. Confirm the time zone of the priority date.');
        out.push('Read the highlighted text before relying on the grade, then print the dossier from the Report tab.');
        return out;
      });

      function candidateVerdict(url) {
        const r = result.value;
        const c = r && (r.candidates || []).find((x) => x.url === url || x.original === url || x.resolvedFrom === url || P.sameDocument(x.url, url));
        if (!c) return 'Not checked.';
        if (c.redirect) return 'Redirect link: open it and add the real address as a corroborating URL.';
        const via = c.resolvedFrom ? `Resolved to ${c.url}. ` : '';
        if (!c.verified) return `${via}Not verified. ${c.notes[c.notes.length - 1] || ''}`.trim();
        const pre = c.captures.filter((x) => x.before);
        const shows = pre.filter((x) => x.check && x.check.features && x.check.features.every((f) => f.verdict === 'present'));
        return via + (shows.length ? `Verified: archived ${P.isoDate(pre[0].date)}; feature present in the capture of ${P.isoDate(shows[0].date)}.`
          : `Archived before the cut-off (first capture ${P.isoDate(pre[0].date)}), but the feature was not confirmed in the checked captures.`);
      }

      function openMark(m) {
        if (m.s.kind === 'wayback' && !(m.s.capture && m.s.capture.check)) {
          ui.tab = 'features';
          announce('That capture has not been read. Check it from the list at the bottom of Feature match.');
          return;
        }
        ui.selectedSource = m.id; ui.tab = 'evidence'; ui.evidenceFilter = 'all';
        nextTick(() => { const el = document.getElementById(`row-${cssId(m.id)}`); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } });
      }
      const cssId = (id) => String(id).replace(/[^A-Za-z0-9]/g, '_').slice(-90);

      /* ---------- Export, import, print ---------- */
      function exportJson() {
        const c = selected.value; if (!c) return;
        const r = result.value;
        const clean = r ? JSON.parse(JSON.stringify(r, (k, v) => (v instanceof Error ? { message: v.message } : k === 'checking' ? undefined : v))) : null;
        const payload = { tool: 'Prior-Art Date Verifier', version: appVersion, exportedAt: new Date().toISOString(), mode: mode.value,
          note: 'Items with kind "findSources", "match", "queries" or "readArchived" under result.aiItems are AI suggestions – unverified.',
          case: { ...caseDef(c), patentNo: c.patentNo, confidential: c.confidential, notes: c.notes }, result: clean, rawResponses: rawStores.get(c.id) || [] };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
        a.download = `${(c.name || 'case').replace(/[^A-Za-z0-9_-]+/g, '-').toLowerCase()}-${P.isoDate(new Date())}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
      function importJson(evt) {
        const file = evt.target.files && evt.target.files[0];
        evt.target.value = '';
        if (!file) return;
        ui.importError = '';
        file.text().then((txt) => {
          let data;
          try { data = JSON.parse(txt); } catch (e) { ui.importError = 'This file is not valid JSON.'; return; }
          const cc = data && data.case;
          if (!cc || typeof cc.url !== 'string' || !Array.isArray(cc.features)) { ui.importError = 'This file is not a case exported by this tool.'; return; }
          const c = { ...blankCase(), name: `${cc.name || 'Imported case'} (imported)`, patentNo: String(cc.patentNo || ''), cutoff: String(cc.cutoff || ''), countOnCutoff: !!cc.countOnCutoff,
            url: cc.url, typeOverride: ['auto', 'web', 'youtube', 'github'].includes(cc.typeOverride) ? cc.typeOverride : 'auto',
            featuresText: cc.features.map(String).join('\n'), corroboratingText: (cc.corroborating || []).map(String).join('\n'), confidential: !!cc.confidential, notes: String(cc.notes || '') };
          cases.value.push(c); persistCases(); selectCase(c.id);
          const r = data.result;
          if (r && Array.isArray(r.sources) && r.reference && r.grade) {
            Object.assign(r, { candidates: r.candidates || [], aiItems: r.aiItems || [], corroborating: r.corroborating || [], leads: r.leads || [], links: r.links || [], running: false, imported: true });
            P.rebuildSources(r);
            runs.value = { ...runs.value, [c.id]: r };
            c.last = { grade: r.grade.grade, at: r.finishedAt, mode: 'imported' };
            persistCases(); bump();
          }
          announce('Case imported.');
        }).catch(() => { ui.importError = 'The file could not be read.'; });
      }
      function printReport() { reportGeneratedAt.value = new Date().toISOString(); ui.tab = 'report'; nextTick(() => setTimeout(() => window.print(), 50)); }

      const reportExcerpts = computed(() => {
        version.value;
        const r = result.value;
        if (!r || !r.features) return [];
        return r.features.map((f, fi) => ({ feature: f,
          items: checkedCaptures.value.filter((x) => x.cap.before && P.featureStatusOf({ capture: x.cap }, fi) === 'present').slice(0, 2)
            .map((x) => ({ date: x.cap.date, url: x.cap.viewUrl, role: x.role, text: x.cap.check.features[fi].best[0] ? x.cap.check.features[fi].best[0].text : '' })) }));
      });

      return {
        appVersion, mode, theme, settings, cases, selectedId, logs, ui, aiPreview, version, P,
        MODULES, TABS, CLASS_TEXT, LIMITATIONS, CONFIDENTIAL_NOTICE, storeOk: store.ok, isLocalFile: P.IS_LOCAL_FILE, demoCaptured, reportGeneratedAt,
        selected, result, grade, features, detectedType, evidenceRows, reportRows, uncheckedCount, checkedCaptures, uncheckedCaptures,
        firstPresent, timeline, miniTimeline, reportTimeline, overrideCount, nearCutoff, runningMessage, countedSummary, excludedSummary,
        nextActions, reportExcerpts,
        selectCase, newCase, duplicateCase, deleteCase, onEdit, setMode, cycleTheme, resetSettings, runSelected, checkCapture, checkBlocked,
        setOverride, runAiTask, answerPreview, openMark, cssId, exportJson, importJson, printReport, highlightParts, candidateVerdict,
        fmt: (d) => (d ? P.formatUTC(d) : ''), day: (d) => (d ? P.isoDate(d) : ''),
        local: (d) => { try { return new Date(d).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } },
        statusText: (s) => ({ present: 'Present', possible: 'Possibly present', absent: 'Not found', unchecked: 'Not checked' }[s] || s),
        stateText: (s) => STATE_TEXT[s] || s,
        typeName: (t) => TYPE_TEXT[t] || 'not recognised yet',
        shortUrl: (u) => { try { const x = new URL(u); return (x.hostname + x.pathname).replace(/\/$/, '').slice(0, 70); } catch (e) { return String(u || '').slice(0, 70); } },
        moduleState: (k) => { version.value; return (result.value && result.value.modules && result.value.modules[k]) || { state: 'waiting', message: '' }; },
        clearLog: () => { logs.value = []; }
      };
    }
  });

  app.component('timeline-chart', TimelineChart);
  app.directive('focus', { mounted: (el) => el.focus() });
  app.config.errorHandler = (err) => {
    console.error(err);
    const el = document.getElementById('fatal');
    if (el) { el.hidden = false; el.textContent = `Something went wrong: ${err && err.message}. Reload the page; saved cases are kept.`; }
  };
  app.mount('#app');
})();

}
</script>
</body>
</html>
