    'pricing', 'login', 'join', 'search', 'explore', 'collections', 'trending', 'enterprise', 'apps', 'users',
    'site', 'security', 'customer-stories', 'readme', 'events', 'codespaces', 'issues', 'pulls',
    'notifications', 'new', 'dashboard', 'organizations']);
  function githubRepo(url) {
    try {
      const u = new URL(url);
      if (bareHost(u.hostname) !== 'github.com') return null;
      const [owner, repoRaw] = u.pathname.split('/').filter(Boolean);
      if (!owner || !repoRaw || GITHUB_RESERVED.has(owner.toLowerCase())) return null;
      const repo = repoRaw.replace(/\.git$/, '');
      const ok = /^[A-Za-z0-9-]+$/.test(owner) && /^[A-Za-z0-9_.-]+$/.test(repo);
      return ok ? { owner, repo } : null;
    } catch (e) { return null; }
  }

  function detectType(url) {
    if (youtubeId(url)) return 'youtube';
    if (githubRepo(url)) return 'github';
    return 'web';
  }

  // Variants tried in order until the archive knows one of them.
  function urlVariants(url) {
    const out = [];
    const add = (x) => { if (x && !out.includes(x)) out.push(x); };
    let u;
    try { u = new URL(url); } catch (e) { return []; }
    add(u.toString());
    const other = new URL(u.toString());
    other.protocol = u.protocol === 'https:' ? 'http:' : 'https:';
    add(other.toString());
    const www = new URL(u.toString());
    www.hostname = u.hostname.startsWith('www.') ? u.hostname.slice(4) : 'www.' + u.hostname;
    add(www.toString());
    if (u.pathname !== '/') {
      const slash = new URL(u.toString());
      slash.pathname = u.pathname.endsWith('/') ? u.pathname.slice(0, -1) : u.pathname + '/';
      add(slash.toString());
    }
    return out;
  }

  // Two URLs point to the same document if host (without www), path and query match.
  function documentKey(url) {
    try {
      const u = new URL(url);
      return bareHost(u.hostname) + (u.pathname.replace(/\/+$/, '') || '') + u.search;
    } catch (e) { return String(url || ''); }
  }
  function sameDocument(a, b) { return !!a && !!b && documentKey(a) === documentKey(b); }

  /* -------------------------------------------------------------------
     Text: tokens, light stemming and lexical scoring.
     ------------------------------------------------------------------- */
  const STOP_WORDS = new Set(('a an the and or of to in on for with by from at as is are was were be been being it its ' +
    'this that these those which who whom whose what when where how than then there their they them can could may might ' +
    'will would shall should do does did has have had not no nor so such into onto over under about between within ' +
    'without via per use used using one each any all some more most other also only same own very just new our we you your')
    .split(' '));

  function normaliseWhitespace(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }
  // Whitespace and typographic quotes/dashes are normalised before quotation checks.
  function normaliseForQuote(s) {
    return normaliseWhitespace(String(s || '').replace(/[‘’‛]/g, "'").replace(/[“”]/g, '"')
      .replace(/[–—]/g, '-').replace(/ /g, ' '));
  }

  function trimDouble(w) { return /([b-df-hj-np-tv-z])\1$/.test(w) && !/(ll|ss|zz)$/.test(w) ? w.slice(0, -1) : w; }
  function stem(word) {
    let w = String(word || '').toLowerCase();
    if (w.length <= 3) return w;
    if (w.endsWith('ies') && w.length > 4) w = w.slice(0, -3) + 'y';
    else if (w.endsWith('sses')) w = w.slice(0, -2);
    else if (w.endsWith('ing') && w.length > 5) w = trimDouble(w.slice(0, -3));
    else if (w.endsWith('ed') && w.length > 4) w = trimDouble(w.slice(0, -2));
    else if (/(s|x|z|ch|sh)es$/.test(w) && w.length > 4) w = w.slice(0, -2);
    else if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) w = w.slice(0, -1);
    if (w.length > 4 && w.endsWith('e')) w = w.slice(0, -1);
    return w;
  }

  function tokenize(text) {
    return String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' ')
      .filter((t) => t.length >= 2 && !STOP_WORDS.has(t)).map(stem);
  }
  function bigrams(tokens) {
    const out = [];
    for (let i = 0; i < tokens.length - 1; i++) out.push(tokens[i] + ' ' + tokens[i + 1]);
    return out;
  }

  /* Lexical score from 0 to 1.
     coverage: share of the feature's content words found in the sentence;
     bigramRatio: share of the feature's word pairs found next to each other;
     an exact phrase match scores 1. */
  function lexicalScore(featureText, sentenceText) {
    const ft = tokenize(featureText);
    const unique = [...new Set(ft)];
    if (!unique.length) return { score: 0, hits: [], phrase: false, coverage: 0 };
    const st = tokenize(sentenceText);
    const present = new Set(st);
    const hits = unique.filter((t) => present.has(t));
    const coverage = hits.length / unique.length;
    const fb = bigrams(ft);
    let bigramRatio = coverage;
    if (fb.length) {
      const sb = new Set(bigrams(st));
      bigramRatio = fb.filter((b) => sb.has(b)).length / fb.length;
    }
    const phrase = normaliseForQuote(sentenceText).toLowerCase().includes(normaliseForQuote(featureText).toLowerCase());
    const score = phrase ? 1 : Math.round((0.75 * coverage + 0.25 * bigramRatio) * 100) / 100;
    return { score, hits, phrase, coverage };
  }

  // Content words of a statement, in their original spelling, for search queries.
  function keywordPhrase(text, max = 5) {
    const words = String(text || '').replace(/[^A-Za-z0-9.+#-]+/g, ' ').split(' ')
      .filter((w) => w.length >= 2 && !STOP_WORDS.has(w.toLowerCase()));
    return [...new Set(words)].slice(0, max).join(' ');
  }

  function splitSentences(text) {
    const out = [];
    for (const line of String(text || '').split(/\n+/)) {
      const l = normaliseWhitespace(line);
      if (!l) continue;
      for (let p of l.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(\[])/)) {
        p = p.trim();
        if (p.length < 3) continue;
        while (p.length > 500) {
          const cut = p.lastIndexOf(' ', 500);
          const k = cut > 200 ? cut : 500;
          out.push(p.slice(0, k));
          p = p.slice(k).trim();
        }
        if (p) out.push(p);
      }
    }
    return out;
  }

  /* Archived HTML is untrusted. DOMParser builds an inert document: scripts do
     not run and images do not load. Only the extracted text is kept. */
  function extractTextFromHtml(html) {
    const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
    const title = normaliseWhitespace(doc.title || '');
    doc.querySelectorAll('script,style,noscript,template,svg,iframe,object,embed,canvas,nav,footer,' +
      '[role="navigation"],[role="contentinfo"],[aria-hidden="true"]').forEach((e) => e.remove());
    const BLOCKS = 'address,article,aside,blockquote,dd,div,dl,dt,fieldset,figcaption,figure,form,h1,h2,h3,h4,h5,h6,' +
      'header,hr,li,main,ol,p,pre,section,table,tr,td,th,ul,br,caption';
    // Line breaks inside the HTML source are only formatting, so all whitespace is
    // collapsed first; a private marker after each block element keeps paragraphs apart.
    const BREAK = '\uE000';
    doc.querySelectorAll(BLOCKS).forEach((e) => e.after(doc.createTextNode(BREAK)));
    const text = (doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ').split(BREAK).join('\n');
    const seen = new Set();
    const sentences = splitSentences(text).filter((s) => (seen.has(s) ? false : (seen.add(s), true)));
    return { title, sentences };
  }

  function verdictFromScore(score, present, possible) {
    if (score >= present) return 'present';
    if (score >= possible) return 'possible';
    return 'absent';
  }
  const VERDICT_RANK = { present: 3, possible: 2, absent: 1, unchecked: 0 };
  function betterVerdict(a, b) { return (VERDICT_RANK[a] || 0) >= (VERDICT_RANK[b] || 0) ? a : b; }

  /* Score all sentences against all features; keep the three best per feature. */
  function scoreSentences(sentences, features, settings, semanticScores) {
    return features.map((feature, fi) => {
      const scored = sentences.map((s, i) => {
        const lex = lexicalScore(feature, s);
        const sem = semanticScores ? semanticScores[fi][i] : null;
        return { i, text: s, lexical: lex.score, hits: lex.hits, semantic: sem };
      });
      const rank = (x) => Math.max(x.lexical, x.semantic == null ? 0 : x.semantic * 0.999);
      scored.sort((a, b) => rank(b) - rank(a));
      const best = scored.slice(0, 3);
      let verdict = 'absent';
      for (const b of best) {
        verdict = betterVerdict(verdict, verdictFromScore(b.lexical, settings.lexicalPresent, settings.lexicalPossible));
        if (b.semantic != null) verdict = betterVerdict(verdict, verdictFromScore(b.semantic, settings.semanticPresent, settings.semanticPossible));
      }
      return { verdict, best, method: semanticScores ? 'lexical + semantic' : 'lexical' };
    });
  }

  function cosine(a, b) {
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  }

  /* An AI quotation is accepted only if it appears, after normalisation, in text
     that the tool fetched itself. A wrong sentence ID is corrected, not trusted. */
  function verifyQuote(quote, sentences, sentenceId) {
    const q = normaliseForQuote(quote);
    if (q.length < 8) return { ok: false, reason: 'The quotation is too short to verify.' };
    if (sentenceId != null && sentences[sentenceId] != null && normaliseForQuote(sentences[sentenceId]).includes(q)) {
      return { ok: true, sentenceId };
    }
    const idx = sentences.findIndex((s) => normaliseForQuote(s).includes(q));
    if (idx >= 0) return { ok: true, sentenceId: idx, corrected: sentenceId != null };
    if (normaliseForQuote(sentences.join(' ')).includes(q)) return { ok: true, sentenceId: null, spansSentences: true };
    return { ok: false, reason: 'The quotation does not appear in the text the tool fetched.' };
  }

  function selectCaptureIndices(count, n) {
    if (count <= 0 || n <= 0) return [];
    if (count <= n) return [...Array(count).keys()];
    if (n === 1) return [count - 1];
    const idx = new Set([0, count - 1]);
    for (let k = 1; k < n - 1; k++) idx.add(Math.round((k * (count - 1)) / (n - 1)));
    return [...idx].sort((a, b) => a - b);
  }

  function buildSearchLinks({ url, title, features, cutoff }) {
    const host = hostOf(url);
    const kw = keywordPhrase(features[0] || title || '') || host;
    const enc = encodeURIComponent;
    return [
      { label: 'Google, results before the cut-off', href: `https://www.google.com/search?q=${enc(`${kw} ${host ? 'site:' + host : ''} before:${cutoff}`.trim())}` },
      { label: 'Google, other sites mentioning it', href: `https://www.google.com/search?q=${enc(`"${host}" ${kw} before:${cutoff}`)}` },
      { label: 'Bing (filter dates by hand)', href: `https://www.bing.com/search?q=${enc(`${kw} ${host}`)}` },
      { label: 'X / Twitter, posts until the cut-off', href: `https://x.com/search?q=${enc(`${kw} until:${cutoff}`)}&f=live` },
      { label: 'Reddit search', href: `https://www.reddit.com/search/?q=${enc(kw)}` },
      { label: 'Wayback listing of the whole site', href: `https://web.archive.org/web/*/${host}/*` }
    ];
  }

  /* -------------------------------------------------------------------
     Evidence grading. Rules are deliberately simple so that an analyst
     can check every step.

     Source classes:
       independent: a third party recorded the date (Internet Archive,
                    Software Heritage, a Hacker News post by someone else)
       platform:    the hosting platform recorded the date (YouTube
                    publishedAt, GitHub release published_at)
       self:        the author supplied the date (commit dates, dates
                    written in the page itself)
       ai:          produced by the AI layer: never counted.

     Independence is counted by dating party: ten Internet Archive captures
     are one witness, not ten. Corroboration needs a second party.
     ------------------------------------------------------------------- */
  const GRADE_ORDER = ['A', 'B', 'C', 'D'];
  const GRADE_TEXT = {
    A: 'Corroborated by independent sources',
    B: 'Supported by one independent or platform date',
    C: 'Only self-reported dates',
    D: 'Not shown before the cut-off'
  };

  function sourceFeatures(source) {
    if (source.capture) return source.capture.check && source.capture.check.features ? source.capture.check.features : null;
    return source.features || null;
  }
  function featureStatusOf(source, fi) {
    const ov = source.override || (source.capture && source.capture.override);
    if (ov && ov[fi]) return ov[fi];
    const feats = sourceFeatures(source);
    if (!feats) return 'unchecked';
    return (feats[fi] && feats[fi].verdict) || 'unchecked';
  }

  function gradeFeature(sources, fi) {
    const counted = sources.filter((s) => s.cls !== 'ai' && s.counts !== false);
    const pre = counted.filter((s) => s.before);
    const presentIn = (s) => featureStatusOf(s, fi) === 'present';
    const byDate = (a, b) => new Date(a.date) - new Date(b.date);
    const indep = pre.filter((s) => s.cls === 'independent');
    const parties = [...new Set(indep.map((s) => s.party))];
    const excluded = sources.filter((s) => s.cls === 'ai' || s.counts === false || !s.before);

    // Rule A: at least two different independent parties dated the reference before
    // the cut-off, and at least one independent source shows the feature.
    const indepPresent = indep.filter(presentIn).sort(byDate);
    if (parties.length >= 2 && indepPresent.length) {
      return { grade: 'A', rule: `Two or more independent dating parties before the cut-off (${parties.join(', ')}), and the feature is present in at least one independent source.`,
        counted: pre, key: indepPresent[0], excluded };
    }
    // Rule B: one independent or platform-recorded source shows the feature before the cut-off.
    const bPresent = pre.filter((s) => (s.cls === 'independent' || s.cls === 'platform') && presentIn(s)).sort(byDate);
    if (bPresent.length) {
      return { grade: 'B', rule: `The feature is present in a source dated by ${bPresent[0].party} (${bPresent[0].cls === 'platform' ? 'platform-recorded' : 'independent'}) before the cut-off.`,
        counted: pre, key: bPresent[0], excluded };
    }
    // Rule C: the feature appears only in sources whose dates the author supplied.
    const cPresent = pre.filter((s) => s.cls === 'self' && presentIn(s)).sort(byDate);
    if (cPresent.length) {
      return { grade: 'C', rule: 'The feature appears only in sources with self-reported dates (for example commit dates), which can be backdated.',
        counted: pre, key: cPresent[0], excluded };
    }
    // Rule D: nothing shows the feature before the cut-off.
    let why;
    if (!pre.length) why = 'No dated source exists before the cut-off.';
    else if (pre.some((s) => ['absent', 'possible'].includes(featureStatusOf(s, fi)))) {
      why = pre.some((s) => featureStatusOf(s, fi) === 'possible')
        ? 'The feature is only possibly present before the cut-off; read the highlighted text and decide.'
        : 'The feature was not found in any checked source before the cut-off.';
    } else why = 'Sources exist before the cut-off, but none was checked for the feature.';
    return { grade: 'D', rule: why, counted: pre, key: null, excluded };
  }

  // The reference must disclose every feature, so the case takes its weakest grade.
  function gradeCase(sources, features) {
    if (!features.length) {
      return { grade: 'D', perFeature: [], keyDate: null, reason: 'Add at least one feature statement to grade the reference.' };
    }
    const perFeature = features.map((f, fi) => ({ feature: f, ...gradeFeature(sources, fi) }));
    const worst = perFeature.reduce((w, p) => (GRADE_ORDER.indexOf(p.grade) > GRADE_ORDER.indexOf(w) ? p.grade : w), 'A');
    const keys = perFeature.map((p) => p.key);
    const keyDate = keys.every(Boolean) ? keys.map((k) => k.date).sort().slice(-1)[0] : null;
    const weakest = perFeature.find((p) => p.grade === worst);
    const reason = features.length > 1 ? `Weakest feature (${perFeature.indexOf(weakest) + 1} of ${features.length}): ${weakest.rule}` : weakest.rule;
    return { grade: worst, perFeature, keyDate, reason };
  }

  /* -------------------------------------------------------------------
     Small JSON schema validator for AI responses (object, array, string,
     integer, number, boolean, enum, required).
     ------------------------------------------------------------------- */
  function validateSchema(value, schema, path = '$') {
    const errs = [];
    const t = schema.type;
    if (t === 'object') {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return [`${path} should be an object`];
      for (const r of schema.required || []) if (!(r in value)) errs.push(`${path}.${r} is missing`);
      for (const [k, sub] of Object.entries(schema.properties || {})) if (k in value) errs.push(...validateSchema(value[k], sub, `${path}.${k}`));
    } else if (t === 'array') {
      if (!Array.isArray(value)) return [`${path} should be an array`];
      value.forEach((v, i) => errs.push(...validateSchema(v, schema.items || {}, `${path}[${i}]`)));
    } else if (t === 'string') {
      if (typeof value !== 'string') errs.push(`${path} should be a string`);
      else if (schema.enum && !schema.enum.includes(value)) errs.push(`${path} should be one of ${schema.enum.join(', ')}`);
    } else if (t === 'integer') { if (!Number.isInteger(value)) errs.push(`${path} should be an integer`); }
    else if (t === 'number') { if (typeof value !== 'number') errs.push(`${path} should be a number`); }
    else if (t === 'boolean') { if (typeof value !== 'boolean') errs.push(`${path} should be true or false`); }
    return errs;
  }

  /* -------------------------------------------------------------------
     Compression for the demo cache (gzip + base64, built into browsers).
     ------------------------------------------------------------------- */
  function bytesToB64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function b64ToBytes(b64) {
    const s = atob(b64), out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  async function gzipToBase64(text) {
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    return bytesToB64(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  async function base64ToText(b64) {
    const stream = new Blob([b64ToBytes(b64)]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  /* -------------------------------------------------------------------
     Network layer: demo cache, proxy, timeouts, one retry, per-host
     concurrency and a request log.
     ------------------------------------------------------------------- */
  class NetError extends Error {
    constructor(kind, message, extra) { super(message); this.kind = kind; Object.assign(this, extra || {}); }
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function fetchWithRetry(url, init, opts) {
    const { timeoutMs = 15000, fetchImpl = global.fetch.bind(global), onRetry, backoffMs = 1500 } = opts || {};
    for (let attempt = 0; attempt < 2; attempt++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      let res;
      try {
        res = await fetchImpl(url, { ...init, signal: ctrl.signal, credentials: 'omit' });
      } catch (e) {
        clearTimeout(timer);
        if (e && e.name === 'AbortError') throw new NetError('timeout', `No response within ${Math.round(timeoutMs / 1000)} seconds.`);
        throw new NetError('network', 'The request was blocked or the network is unavailable (a CORS block looks the same).');
      }
      clearTimeout(timer);
      if ((res.status === 429 || res.status >= 500) && attempt === 0) {
        const ra = Number(res.headers && res.headers.get && res.headers.get('retry-after'));
        if (onRetry) onRetry(res.status);
        await sleep(Math.min(ra > 0 ? ra * 1000 : backoffMs, 5000));
        continue;
      }
      return res;
    }
  }

  function wrapResponse(status, text, contentType, meta) {
    return {
      status, ok: status >= 200 && status < 300, contentType: contentType || '', ...meta,
      text: () => text,
      json: () => {
        try { return JSON.parse(text); } catch (e) { throw new NetError('parse', 'The response was not valid JSON.'); }
      }
    };
  }

  function redactUrl(url) { return String(url).replace(/([?&]key=)[^&]+/, '$1REDACTED'); }

  function createNet(options) {
    const opt = Object.assign({ getMode: () => 'live', getProxy: () => '', cache: {}, onLog: null, recorder: null, fetchImpl: null, onRaw: null }, options);
    const slots = new Map();
    let logId = 0;

    async function withSlot(host, fn) {
      const limit = ARCHIVE_HOSTS.includes(host) ? 3 : 4;
      if (!slots.has(host)) slots.set(host, { active: 0, queue: [] });
      const s = slots.get(host);
      if (s.active >= limit) await new Promise((r) => s.queue.push(r));
      s.active++;
      try { return await fn(); } finally { s.active--; const next = s.queue.shift(); if (next) next(); }
    }

    function canReach(host) {
      const mode = opt.getMode();
      if (mode !== 'live') return true;
      return !isBlockedHost(host) || !!String(opt.getProxy() || '').trim();
    }

    /* cacheUrl is the URL without secrets; it is the key for the demo cache and
       the text shown in the request log. */
    async function request(url, init) {
      const { method = 'GET', headers = {}, body, timeoutMs = 15000, cacheUrl, label = '', forceProxy = false } = init || {};
      const mode = opt.getMode();
      const host = new URL(url).hostname;
      const shownUrl = redactUrl(cacheUrl || url);
      const key = method === 'GET' ? shownUrl : `${method} ${shownUrl}`;
      const entry = { id: ++logId, at: new Date().toISOString(), method, url: shownUrl, label, via: '', status: '', ms: 0, note: '' };
      const t0 = Date.now();
      try {
        if (mode === 'demo') {
          const c = opt.cache[key];
          if (!c) throw new NetError('demo-miss', 'Not in the demo cache. Switch to live mode to run this request.');
          const text = await base64ToText(c.gz);
          entry.via = 'cached'; entry.status = c.status; entry.note = `cached on ${String(c.capturedAt).slice(0, 10)}`;
          if (opt.onRaw) opt.onRaw({ key, status: c.status, text, capturedAt: c.capturedAt, cached: true });
          return wrapResponse(c.status, text, c.contentType, { cached: true, capturedAt: c.capturedAt, finalUrl: c.finalUrl || null });
        }
        let target = url, via = 'live';
        if (mode === 'live' && (forceProxy || isBlockedHost(host))) {
          const p = String(opt.getProxy() || '').trim();
          if (!p) throw new NetError('needs-proxy', IS_LOCAL_FILE && host === 'archive.org'
            ? 'archive.org refuses requests from a page opened as a local file. Open the published site, serve the folder over http, or add a proxy in Settings.'
            : `${host} does not allow requests from web pages. Add a CORS proxy in Settings, or use demo mode.`);
          target = p + encodeURIComponent(url);
          via = 'proxy';
        }
        const res = await withSlot(host, () => fetchWithRetry(target, { method, headers, body }, {
          timeoutMs, fetchImpl: opt.fetchImpl || undefined, onRetry: (st) => { entry.note = `retried once after ${st}`; }
        }));
        const text = await res.text();
        const ct = res.headers.get('content-type') || '';
        const finalUrl = via === 'proxy' ? (res.headers.get('x-final-url') || null) : (res.url || null);
        entry.via = via; entry.status = res.status;
        if (opt.recorder) opt.recorder.set(key, { status: res.status, contentType: ct, text, finalUrl, capturedAt: new Date().toISOString() });
        if (opt.onRaw) opt.onRaw({ key, status: res.status, text, cached: false });
        return wrapResponse(res.status, text, ct, { cached: false, finalUrl, headers: res.headers });
      } catch (err) {
        entry.status = entry.status || err.kind || 'error';
        entry.note = err.message;
        throw err;
      } finally {
        entry.ms = Date.now() - t0;
        if (opt.onLog) opt.onLog(entry);
      }
    }
    return { request, canReach, get: (url, init) => request(url, { ...(init || {}), method: 'GET' }) };
  }

  /* -------------------------------------------------------------------
     Module A: snapshot finder (Wayback Machine)
     ------------------------------------------------------------------- */
  function parseCdx(text) {
    const t = String(text || '').trim();
    if (!t) return [];
    let rows;
    try { rows = JSON.parse(t); } catch (e) { return null; }
    if (!Array.isArray(rows) || rows.length < 2) return [];
    const head = rows[0];
    return rows.slice(1).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i]])));
  }

  function cdxUrl(url, params) {
    const q = new URLSearchParams({ url, output: 'json', fl: 'timestamp,original,statuscode,mimetype,digest', ...params });
    return `https://web.archive.org/cdx/search/cdx?${q.toString()}`;
  }

  function toCapture(row, cutoffYMD, countOnCutoff, method) {
    const date = parseWaybackTimestamp(row.timestamp);
    return {
      ts: row.timestamp, original: row.original, status: row.statuscode, method,
      date: date ? date.toISOString() : null,
      before: date ? isBeforeCutoff(date, cutoffYMD, countOnCutoff) : false,
      viewUrl: `https://web.archive.org/web/${row.timestamp}/${row.original}`,
      rawUrl: `https://web.archive.org/web/${row.timestamp}id_/${row.original}`,
      check: null
    };
  }

  async function findSnapshots(net, url, c) {
    const out = { method: null, variant: null, captures: [], notes: [], status: 'done' };
    const cutDay = waybackDay(parseYMD(c.cutoff));
    if (net.canReach('web.archive.org')) {
      out.method = 'cdx';
      for (const v of urlVariants(url)) {
        // One capture per month keeps the list short; the first-date refinement adds daily detail later.
        const res = await net.get(cdxUrl(v, { filter: 'statuscode:200', collapse: 'timestamp:6', to: cutDay, limit: '1000' }), { label: 'Wayback CDX, up to the cut-off' });
        const txt = res.text();
        if (res.status === 429) throw new NetError('rate-limit', 'The Internet Archive is limiting requests from this connection. Wait a minute and run the check again.');
        if (res.status >= 500) throw new NetError('http', `The Internet Archive answered ${res.status}. It may be busy; try again shortly.`);
        if (res.status === 403 || /Blocked Site Error|robots\.txt/i.test(txt)) {
          out.notes.push('The archive refuses to list this site (excluded by robots.txt or at the owner\'s request).');
          out.status = 'blocked';
          return out;
        }
        const rows = parseCdx(txt);
        if (rows === null) throw new NetError('parse', 'The CDX index returned an unexpected answer.');
        if (rows.length) {
          out.variant = v;
          out.captures = rows.map((r) => toCapture(r, c.cutoff, c.countOnCutoff, 'cdx'));
          break;
        }
      }
      if (!out.variant) {
        // Explain why nothing was found: redirects and errors are filtered out above.
        const any = await net.get(cdxUrl(url, { to: cutDay, limit: '20' }), { label: 'Wayback CDX, any status' });
        const rows = parseCdx(any.text()) || [];
        if (rows.length) {
          const codes = [...new Set(rows.map((r) => r.statuscode))].join(', ');
          out.notes.push(`Only redirect or error captures exist before the cut-off (status ${codes}). Try the address the page redirected to.`);
        } else out.notes.push('The Internet Archive has no capture of this address up to the cut-off.');
        out.status = 'empty';
      } else if (out.variant !== url) out.notes.push(`Matched the variant ${out.variant}.`);
      const after = await net.get(cdxUrl(out.variant || url, { filter: 'statuscode:200', collapse: 'timestamp:6', from: cutDay, limit: '12' }), { label: 'Wayback CDX, after the cut-off' });
      const afterRows = parseCdx(after.text()) || [];
      const seen = new Set(out.captures.map((x) => x.ts));
      for (const r of afterRows) if (!seen.has(r.timestamp)) out.captures.push(toCapture(r, c.cutoff, c.countOnCutoff, 'cdx'));
    } else if (!net.canReach('archive.org')) {
      out.method = 'availability';
      out.status = 'blocked';
      out.reason = 'Opened as a local file: the Internet Archive refuses requests from local files, so no archive dates could be read. Open the published site, serve the folder over http, or add the proxy in Settings.';
      out.notes.push(out.reason);
    } else {
      // Fallback: the availability API answers from web pages but gives only the closest
      // capture to a date, so a handful of dates are sampled. It is slow and sometimes
      // answers "nothing" for a page it holds, so empty answers are asked once more.
      out.method = 'availability';
      const base = parseYMD(c.cutoff);
      const offsets = [0, -1, -3, -6, -12, -24, -48, -96, 1];
      const seen = new Set();
      const tally = { asked: 0, empty: 0, errors: {} };
      const lookup = async (v, m) => {
        tally.asked++;
        const stamp = waybackDay(addMonthsUTC(base, m));
        try {
          const r = await net.get(`https://archive.org/wayback/available?url=${encodeURIComponent(v)}&timestamp=${stamp}`, { label: 'Wayback availability', timeoutMs: 20000 });
          if (!r.ok) { const k = `HTTP ${r.status}`; tally.errors[k] = (tally.errors[k] || 0) + 1; return { m, snap: null, failed: true }; }
          const snaps = r.json().archived_snapshots || {};
          const snap = snaps.closest && snaps.closest.available ? snaps.closest : null;
          if (!snap) tally.empty++;
          return { m, snap };
        } catch (e) {
          const k = e.kind === 'timeout' ? 'timeout' : e.kind === 'parse' ? 'unreadable answer' : 'network error';
          tally.errors[k] = (tally.errors[k] || 0) + 1;
          return { m, snap: null, failed: true };
        }
      };
      const add = (s) => {
        if (!s || seen.has(s.timestamp)) return;
        seen.add(s.timestamp);
        const original = String(s.url).replace(/^https?:\/\/web\.archive\.org\/web\/\d+\//, '');
        out.captures.push(toCapture({ timestamp: s.timestamp, original, statuscode: s.status }, c.cutoff, c.countOnCutoff, 'availability'));
      };
      for (const v of urlVariants(url).slice(0, 2)) {
        const results = await Promise.all(offsets.map((m) => lookup(v, m)));
        results.forEach((x) => add(x.snap));
        // Rate limited: stop at once rather than adding to the load.
        if (tally.errors['HTTP 429']) break;
        if (!out.captures.length) {
          const retry = results.filter((x) => !x.snap && !x.failed).slice(0, 4);
          if (retry.length) { await sleep(1200); (await Promise.all(retry.map((x) => lookup(v, x.m)))).forEach((x) => add(x.snap)); }
        }
        if (out.captures.length) { out.variant = v; break; }
      }
      const errs = Object.entries(tally.errors).map(([k, n]) => `${k} ×${n}`).join(', ');
      if (out.captures.length) {
        out.notes.push('Captures were sampled through the availability API, because the full capture list (CDX) cannot be read from a web page. Add the proxy in Settings for the complete list.');
      } else if (errs) {
        out.status = 'failed';
        out.reason = tally.errors['HTTP 429']
          ? `The Internet Archive is limiting requests from this connection (HTTP 429 on ${tally.errors['HTTP 429']} of ${tally.asked} lookups). Wait a few minutes before running the check again.`
          : `The Internet Archive's availability service did not answer ${Object.values(tally.errors).reduce((a, b) => a + b, 0)} of ${tally.asked} lookups (${errs}). Wait a minute and run the check again, or add the proxy in Settings.`;
        out.notes.push(out.reason);
      } else {
        out.status = 'empty';
        out.reason = `The Internet Archive's availability service returned no capture for ${tally.asked} sampled dates. The service is sometimes unreliable, so run the check again, or add the proxy in Settings for the full list.`;
        out.notes.push(out.reason);
      }
    }
    out.captures.sort((a, b) => a.ts.localeCompare(b.ts));
    return out;
  }

  /* -------------------------------------------------------------------
     Module B: feature presence checker
     ------------------------------------------------------------------- */
  let embedderPromise = null;
  function loadEmbedder(onProgress, timeoutMs = 60000) {
    if (!embedderPromise) {
      embedderPromise = Promise.race([
        (async () => {
          const mod = await import(TRANSFORMERS_URL);
          return mod.pipeline('feature-extraction', EMBEDDING_MODEL, { progress_callback: onProgress });
        })(),
        sleep(timeoutMs).then(() => { throw new Error('The model took too long to load.'); })
      ]);
      embedderPromise.catch(() => { embedderPromise = null; });
    }
    return embedderPromise;
  }
  async function embedTexts(texts, onProgress) {
    const pipe = await loadEmbedder(onProgress);
    const out = await pipe(texts, { pooling: 'mean', normalize: true });
    return out.tolist();
  }
  async function semanticScoresFor(sentences, features, onProgress) {
    const limited = sentences.slice(0, 400);
    const vecs = await embedTexts([...features, ...limited], onProgress);
    const fv = vecs.slice(0, features.length), sv = vecs.slice(features.length);
    return fv.map((f) => sentences.map((_, i) => (i < sv.length ? Math.round(cosine(f, sv[i]) * 100) / 100 : null)));
  }

  function allFeaturesPresent(cap) {
    return !!(cap.check && cap.check.features && cap.check.features.every((f) => f.verdict === 'present'));
  }

  async function checkOneCapture(net, cap, features, settings, env) {
    if (cap.check && cap.check.features) return cap;
    try {
      const res = await net.get(cap.rawUrl, { label: 'Archived page (raw)' });
      if (!res.ok) { cap.check = { error: `The archive answered ${res.status} for this capture.` }; return cap; }
      const { title, sentences } = extractTextFromHtml(res.text());
      if (env.textStore) env.textStore.set(cap.rawUrl, { title, sentences });
      let semantic = null, semanticError = null;
      if (settings.semantic && sentences.length) {
        try { semantic = await semanticScoresFor(sentences, features, env.onModelProgress); }
        catch (e) { semanticError = e.message || 'The semantic model could not be loaded.'; }
      }
      cap.check = {
        title, sentenceCount: sentences.length, features: scoreSentences(sentences, features, settings, semantic),
        semanticError, redirectedTo: res.finalUrl && !String(res.finalUrl).includes(cap.ts) ? res.finalUrl : null
      };
    } catch (e) {
      cap.check = { error: e.message, kind: e.kind };
    }
    if (env.onCaptureChecked) env.onCaptureChecked(cap);
    return cap;
  }

  async function runPool(items, limit, fn) {
    const out = [];
    let i = 0;
    const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
    });
    await Promise.all(workers);
    return out;
  }

  async function checkFeatures(net, captures, features, settings, env, opts) {
    const o = Object.assign({ count: settings.capturesToCheck, refine: settings.refineFirstDate, maxRefine: 8 }, opts);
    const pre = captures.filter((x) => x.before);
    const notes = [];
    if (!features.length) return { status: 'skipped', notes: ['No feature statements to check.'] };
    if (!pre.length) return { status: 'skipped', notes: ['No capture before the cut-off to check.'] };
    if (!net.canReach('web.archive.org')) {
      return { status: 'needs-proxy', notes: ['Archived pages are on web.archive.org, which does not allow requests from web pages. Add a proxy in Settings, or use demo mode.'] };
    }
    const chosen = selectCaptureIndices(pre.length, o.count).map((i) => pre[i]);
    await runPool(chosen, 3, (cap) => checkOneCapture(net, cap, features, settings, env));

    if (o.refine && chosen.length) {
      // Bisect between the last checked capture without the features and the first
      // with them. Assumes that once the features appear they stay on the page.
      let fetches = 0;
      const bisect = async (list) => {
        let lo = -1, hi = -1;
        const ci = list.map((x, i) => (x.check && x.check.features ? i : -1)).filter((i) => i >= 0);
        for (const i of ci) { if (allFeaturesPresent(list[i])) { hi = i; break; } lo = i; }
        if (hi <= 0 || lo < 0) return { lo, hi };
        while (hi - lo > 1 && fetches < o.maxRefine) {
          const mid = Math.floor((lo + hi) / 2);
          fetches++;
          await checkOneCapture(net, list[mid], features, settings, env);
          if (allFeaturesPresent(list[mid])) hi = mid; else if (list[mid].check && list[mid].check.features) lo = mid; else break;
        }
        return { lo, hi };
      };
      const { lo, hi } = await bisect(pre);
      if (lo >= 0 && hi > lo && hi - lo === 1 && fetches < o.maxRefine && pre[lo].ts.slice(0, 8) !== pre[hi].ts.slice(0, 8)) {
        // Daily detail between the two monthly captures.
        try {
          const res = await net.get(cdxUrl(pre[lo].original, { filter: 'statuscode:200', collapse: 'timestamp:8', from: pre[lo].ts, to: pre[hi].ts, limit: '400' }), { label: 'Wayback CDX, daily detail' });
          const rows = (parseCdx(res.text()) || []).filter((r) => r.timestamp > pre[lo].ts && r.timestamp < pre[hi].ts);
          if (rows.length) {
            const daily = [pre[lo], ...rows.map((r) => toCapture(r, env.cutoff, env.countOnCutoff, 'cdx')), pre[hi]];
            await bisect(daily);
            const known = new Set(captures.map((x) => x.ts));
            for (const d of daily) if (!known.has(d.ts)) { d.refined = true; captures.push(d); }
            captures.sort((a, b) => a.ts.localeCompare(b.ts));
          }
        } catch (e) { notes.push(`Daily refinement skipped: ${e.message}`); }
      }
      if (fetches) notes.push(`Refined the first date with ${fetches} extra capture${fetches > 1 ? 's' : ''}.`);
    }
    const checked = captures.filter((x) => x.check);
    const failed = checked.filter((x) => x.check.error);
    if (failed.length) notes.push(`${failed.length} capture${failed.length > 1 ? 's' : ''} could not be checked: ${failed[0].check.error}`);
    const semErr = checked.find((x) => x.check.semanticError);
    return { status: failed.length === checked.length ? 'failed' : 'done', notes, semanticError: semErr ? semErr.check.semanticError : null };
  }

  /* -------------------------------------------------------------------
     Module C: GitHub, Software Heritage, YouTube
     ------------------------------------------------------------------- */
  function featureCheckOfText(text, features, settings, cap) {
    return features.map((f) => {
      const lex = lexicalScore(f, text);
      let verdict = verdictFromScore(lex.score, settings.lexicalPresent, settings.lexicalPossible);
      if (cap && verdict === 'present') verdict = cap;
      return { verdict, best: [{ text: normaliseWhitespace(text).slice(0, 400), lexical: lex.score, hits: lex.hits }], method: 'lexical' };
    });
  }

  async function checkGitHub(net, repoRef, c, settings) {
    const out = { status: 'done', sources: [], notes: [], rateRemaining: null, htmlUrl: null };
    const base = `https://api.github.com/repos/${repoRef.owner}/${repoRef.repo}`;
    const res = await net.get(base, { label: 'GitHub repository' });
    const rem = res.headers && res.headers.get('x-ratelimit-remaining');
    out.rateRemaining = rem != null ? Number(rem) : null;
    if (res.status === 404) { out.status = 'failed'; out.notes.push('GitHub has no public repository at this address.'); return out; }
    if (res.status === 403 || res.status === 429) {
      out.status = 'rate-limited';
      out.notes.push('GitHub refused the request: the hourly limit of 60 requests for unsigned visitors has probably been reached. Try again later.');
      return out;
    }
    if (!res.ok) { out.status = 'failed'; out.notes.push(`GitHub answered ${res.status}.`); return out; }
    const repo = res.json();
    out.htmlUrl = repo.html_url;
    const mk = (s) => ({ ...s, before: isBeforeCutoff(s.date, c.cutoff, c.countOnCutoff) });
    out.sources.push(mk({ kind: 'github-created', party: 'GitHub', cls: 'platform', date: repo.created_at, label: 'Repository created on GitHub', url: repo.html_url, features: null,
      note: 'Shows that the repository existed. It says nothing about what it contained at the time.' }));

    const rel = await net.get(`${base}/releases?per_page=100`, { label: 'GitHub releases' });
    if (rel.ok) {
      for (const r of rel.json()) {
        if (!r.published_at || r.draft) continue;
        const text = `${r.name || r.tag_name}. ${r.body || ''}`;
        out.sources.push(mk({ kind: 'github-release', party: 'GitHub', cls: 'platform', date: r.published_at, label: `Release ${r.tag_name}`, url: r.html_url,
          features: featureCheckOfText(text, c.features, settings),
          note: 'GitHub records when a release is published, but the release text can be edited later and a release can be created long after its code.' }));
      }
    }
    const tags = await net.get(`${base}/tags?per_page=100`, { label: 'GitHub tags' });
    if (tags.ok) {
      for (const t of tags.json().slice(0, 5)) {
        try {
          const cm = await net.get(t.commit.url, { label: `Commit of tag ${t.name}` });
          if (!cm.ok) continue;
          const d = cm.json().commit.committer.date;
          out.sources.push(mk({ kind: 'github-tag', party: 'Git (self-reported)', cls: 'self', date: d, label: `Tag ${t.name} points to a commit dated`, url: `${repo.html_url}/releases/tag/${encodeURIComponent(t.name)}`,
            features: null, note: 'Commit dates are set on the committer\'s computer and can be backdated.' }));
        } catch (e) { /* skip one tag */ }
      }
    }
    const until = new Date(cutoffLimitMs(c.cutoff, c.countOnCutoff)).toISOString().replace('.000Z', 'Z');
    const commits = await net.get(`${base}/commits?until=${encodeURIComponent(until)}&per_page=100`, { label: 'GitHub commits before the cut-off' });
    if (commits.ok) {
      const matched = [];
      for (const cm of commits.json()) {
        const msg = cm.commit.message || '';
        const fc = featureCheckOfText(msg, c.features, settings);
        if (fc.some((f) => f.verdict !== 'absent')) matched.push({ cm, fc });
      }
      for (const { cm, fc } of matched.slice(0, 10)) {
        out.sources.push(mk({ kind: 'github-commit', party: 'Git (self-reported)', cls: 'self', date: cm.commit.committer.date, label: `Commit ${cm.sha.slice(0, 7)}: ${cm.commit.message.split('\n')[0].slice(0, 90)}`,
          url: cm.html_url, features: fc, note: 'Commit dates are self-reported and can be backdated.' }));
      }
      if (!matched.length) out.notes.push('No commit message before the cut-off matches the feature statements.');
    }
    return out;
  }

  async function checkSoftwareHeritage(net, originUrls, c) {
    const out = { status: 'done', sources: [], notes: [] };
    for (const origin of originUrls) {
      const first = await net.get(`https://archive.softwareheritage.org/api/1/origin/${origin}/visit/1/`, { label: 'Software Heritage first visit' });
      if (first.status === 404) continue;
      if (!first.ok) { out.status = 'failed'; out.notes.push(`Software Heritage answered ${first.status}.`); return out; }
      const v = first.json();
      const latest = await net.get(`https://archive.softwareheritage.org/api/1/origin/${origin}/visit/latest/`, { label: 'Software Heritage latest visit' });
      const lv = latest.ok ? latest.json() : null;
      const browse = `https://archive.softwareheritage.org/browse/origin/visits/?origin_url=${encodeURIComponent(origin)}`;
      out.sources.push({ kind: 'swh-visit', party: 'Software Heritage', cls: 'independent', date: v.date, label: 'Software Heritage first archived the repository', url: browse,
        features: null, before: isBeforeCutoff(v.date, c.cutoff, c.countOnCutoff),
        note: 'An independent archive confirms the repository was public on this date. Its archived files were not checked for the feature.' });
      if (lv && lv.visit > 1) out.notes.push(`Software Heritage has ${lv.visit} visits of ${origin}; the latest is ${formatUTC(lv.date)}.`);
      out.origin = origin;
      return out;
    }
    out.status = 'empty';
    out.notes.push('Software Heritage has not archived this repository. Its archiving began in the mid-2010s, so it cannot corroborate earlier dates.');
    return out;
  }

  async function checkYouTube(net, id, key, c, settings) {
    const out = { status: 'done', sources: [], notes: [] };
    if (!key) {
      out.status = 'skipped';
      out.notes.push('No YouTube Data API key in Settings, so the upload date was not read. The archived watch page is checked instead.');
      return out;
    }
    const cacheUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=${id}`;
    const res = await net.get(`${cacheUrl}&key=${encodeURIComponent(key)}`, { cacheUrl, label: 'YouTube video' });
    const data = res.json();
    if (!res.ok) {
      const reason = data.error && data.error.errors && data.error.errors[0] && data.error.errors[0].reason;
      out.status = 'failed';
      out.notes.push(reason === 'keyInvalid' || res.status === 400 ? 'The YouTube API key is not valid.' :
        reason === 'quotaExceeded' ? 'The YouTube API quota for this key is used up for today.' : `YouTube answered ${res.status}${reason ? ' (' + reason + ')' : ''}.`);
      return out;
    }
    const item = data.items && data.items[0];
    if (!item) { out.status = 'empty'; out.notes.push('YouTube has no public video with this ID.'); return out; }
    const sn = item.snippet;
    out.sources.push({ kind: 'youtube', party: 'YouTube', cls: 'platform', date: sn.publishedAt, label: `Video "${sn.title}" by ${sn.channelTitle}`,
      url: `https://www.youtube.com/watch?v=${id}`, before: isBeforeCutoff(sn.publishedAt, c.cutoff, c.countOnCutoff),
      // Titles and descriptions can be edited after upload, so a text match is capped at "possible".
      features: featureCheckOfText(`${sn.title}. ${sn.description || ''}`, c.features, settings, 'possible'),
      note: 'YouTube records the publication date. Titles and descriptions can be edited after upload, so they do not prove what was public on that date.' });
    return out;
  }

  /* -------------------------------------------------------------------
     Module D: corroboration helper (Hacker News + search links)
     ------------------------------------------------------------------- */
  // Hosts shared by millions of unrelated pages: a matching host proves nothing.
  const GENERIC_HOSTS = new Set(['github.com', 'youtube.com', 'youtu.be', 'twitter.com', 'x.com', 'medium.com', 'reddit.com',
    'google.com', 'facebook.com', 'linkedin.com', 'blogspot.com', 'wordpress.com', 'gist.github.com']);

  function escapeRegExp(t) { return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // A name that identifies the reference: the repository name, or the site name (sqlite for sqlite.org).
  function referenceName(refUrl) {
    const gh = githubRepo(refUrl);
    if (gh) return gh.repo.toLowerCase();
    const host = hostOf(refUrl);
    if (!host || GENERIC_HOSTS.has(host)) return '';
    const label = host.split('.').slice(-2, -1)[0] || '';
    return label.length >= 3 ? label.toLowerCase() : '';
  }

  async function searchHackerNews(net, refUrl, title, c, settings) {
    const out = { status: 'done', sources: [], leads: [], notes: [] };
    const lim = Math.floor(cutoffLimitMs(c.cutoff, c.countOnCutoff) / 1000);
    const host = hostOf(refUrl);
    const gh = githubRepo(refUrl);
    const name = referenceName(refUrl);
    const queries = [{ q: gh ? `${gh.owner}/${gh.repo}` : host, restrict: 'url' }];
    for (const f of c.features.slice(0, 2)) { const k = keywordPhrase(f, 4); if (k) queries.push({ q: name && !k.toLowerCase().includes(name) ? `${name} ${k}` : k }); }
    if (title && tokenize(title).length >= 2) queries.push({ q: title.slice(0, 80) });
    const seen = new Set();
    // A post is related to the reference if it links to it, links to the same (non-generic)
    // site or repository, or names the site or repository in its title.
    const related = (h) => {
      const u = h.url || '';
      if (sameDocument(u, refUrl)) return true;
      if (gh && u.toLowerCase().includes(`github.com/${gh.owner}/${gh.repo}`.toLowerCase())) return true;
      if (u && !GENERIC_HOSTS.has(host) && hostOf(u) === host) return true;
      return !!name && new RegExp('\\b' + escapeRegExp(name) + '\\b', 'i').test(h.title || '');
    };
    for (const qq of queries) {
      const params = new URLSearchParams({ query: qq.q, tags: 'story', hitsPerPage: '20', numericFilters: `created_at_i<${lim}` });
      if (qq.restrict) params.set('restrictSearchableAttributes', qq.restrict);
      try {
        const res = await net.get(`https://hn.algolia.com/api/v1/search?${params.toString()}`, { label: 'Hacker News search' });
        if (!res.ok) { out.notes.push(`Hacker News search answered ${res.status}.`); continue; }
        for (const h of res.json().hits || []) {
          if (seen.has(h.objectID) || !related(h)) continue;
          seen.add(h.objectID);
          const text = `${h.title || ''}. ${(h.story_text || '').replace(/<[^>]+>/g, ' ')}`;
          const features = featureCheckOfText(text, c.features, settings);
          const src = {
            kind: 'hn', party: 'Hacker News', cls: 'independent', date: h.created_at, label: `"${h.title}" posted by ${h.author}`,
            url: `https://news.ycombinator.com/item?id=${h.objectID}`, linkedUrl: h.url || null, features,
            before: isBeforeCutoff(h.created_at, c.cutoff, c.countOnCutoff),
            note: 'Hacker News records the posting date. The poster is assumed to be a third party; check this.'
          };
          // Counted only if it links to the reference itself or shows the feature; other related posts are leads.
          if (sameDocument(h.url, refUrl) || features.some((f) => f.verdict === 'present')) out.sources.push(src);
          else out.leads.push(src);
        }
      } catch (e) { out.notes.push(`Hacker News search failed: ${e.message}`); }
    }
    if (!out.sources.length) { out.status = 'empty'; out.notes.push('No related Hacker News post before the cut-off links to the reference or shows the feature.'); }
    return out;
  }

  /* -------------------------------------------------------------------
     Orchestrator: runs the modules for one case and reports progress.
     env: { net, settings, textStore, on: { module(name, state, message), update() } }
     ------------------------------------------------------------------- */
  // Each Wayback capture becomes one dated source. Its feature results live on the
  // capture itself (capture.check), so checking a capture later updates the source.
  function waybackSources(captures, role, url, extra) {
    return captures.map((cap) => Object.assign({
      kind: 'wayback', party: 'Internet Archive', cls: 'independent', date: cap.date, before: cap.before, role,
      label: `${role === 'reference' ? 'Reference' : 'Corroborating page'} captured by the Internet Archive${cap.method === 'availability' ? ' (sampled)' : ''}`,
      url: cap.viewUrl, pageUrl: url, ts: cap.ts, capture: cap, features: null, note: ''
    }, extra || {}));
  }

  async function runCase(caseDef, env) {
    const c = { ...caseDef, features: (caseDef.features || []).map(normaliseWhitespace).filter(Boolean) };
    const settings = env.settings;
    const mod = (name, state, message) => env.on && env.on.module && env.on.module(name, state, message);
    const result = {
      startedAt: new Date().toISOString(), mode: env.mode || 'live', url: null, type: null,
      reference: { captures: [], method: null, notes: [] }, corroborating: [], sources: [], leads: [], links: [],
      modules: {}, aiItems: [], candidates: [], grade: null
    };
    const setMod = (name, state, message) => { result.modules[name] = { state, message: message || '' }; mod(name, state, message); };
    const norm = normaliseInputUrl(c.url);
    if (!norm.ok) { setMod('A', 'failed', norm.error); result.grade = gradeCase([], c.features); return result; }
    const url = norm.url;
    result.url = url;
    const type = c.typeOverride && c.typeOverride !== 'auto' ? c.typeOverride : detectType(url);
    result.type = type;
    const ytId = type === 'youtube' ? youtubeId(url) : null;
    const gh = type === 'github' ? githubRepo(url) : null;
    const archiveUrl = ytId ? `https://www.youtube.com/watch?v=${ytId}` : gh ? `https://github.com/${gh.owner}/${gh.repo}` : url;
    const envB = { ...env, cutoff: c.cutoff, countOnCutoff: c.countOnCutoff };

    // Module A
    setMod('A', 'running', 'Listing captures in the Internet Archive');
    try {
      const a = await findSnapshots(env.net, archiveUrl, c);
      result.reference = a;
      const pre = a.captures.filter((x) => x.before).length;
      setMod('A', a.status, a.status === 'done'
        ? `${pre} capture${pre === 1 ? '' : 's'} before the cut-off, ${a.captures.length - pre} after.${a.method === 'availability' ? ' Sampled through the availability API; add the proxy in Settings for the full list.' : ''}${a.variant && a.variant !== archiveUrl ? ` Matched ${a.variant}.` : ''}`
        : (a.reason || a.notes[a.notes.length - 1] || 'No capture found.'));
    } catch (e) { setMod('A', 'failed', e.message); result.reference.error = e; }
    env.on && env.on.update && env.on.update(result);

    // Module B (reference)
    if (result.reference.captures.length) {
      const count = type === 'web' ? settings.capturesToCheck : 0;
      if (count) setMod('B', 'running', 'Checking archived pages for the features');
      if (!count) setMod('B', 'skipped', 'Archived GitHub and YouTube pages are large, so none is checked by default. Open Feature match to check a capture.');
      else {
        try {
          const b = await checkFeatures(env.net, result.reference.captures, c.features, settings, envB, { count });
          result.reference.checkNotes = b.notes;
          result.reference.semanticError = b.semanticError || null;
          const n = result.reference.captures.filter((x) => x.check && x.check.features).length;
          setMod('B', b.status === 'done' ? 'done' : b.status === 'needs-proxy' ? 'failed' : b.status, b.status === 'done' ? `${n} capture${n === 1 ? '' : 's'} checked. ${b.notes.join(' ')}` : b.notes.join(' '));
          result.reference.needsProxy = b.status === 'needs-proxy';
        } catch (e) { setMod('B', 'failed', e.message); }
      }
    } else setMod('B', 'skipped', 'No captures to check.');
    env.on && env.on.update && env.on.update(result);

    // Module C
    const cSources = [];
    if (gh) {
      setMod('C', 'running', 'Reading GitHub and Software Heritage');
      try {
        const g = await checkGitHub(env.net, gh, c, settings);
        cSources.push(...g.sources);
        result.github = g;
        const origins = [...new Set([g.htmlUrl, `https://github.com/${gh.owner}/${gh.repo}`].filter(Boolean))];
        const s = await checkSoftwareHeritage(env.net, origins, c);
        cSources.push(...s.sources);
        result.swh = s;
        setMod('C', g.status === 'done' ? 'done' : 'failed', [`${g.sources.length} GitHub dates.`, ...g.notes, ...s.notes].join(' '));
      } catch (e) { setMod('C', 'failed', e.message); }
    } else if (ytId) {
      setMod('C', 'running', 'Reading the YouTube upload date');
      try {
        const y = await checkYouTube(env.net, ytId, settings.youtubeKey, c, settings);
        cSources.push(...y.sources);
        result.youtube = y;
        setMod('C', y.status === 'done' ? 'done' : y.status === 'skipped' ? 'skipped' : 'failed', y.notes.join(' ') || 'Upload date read.');
      } catch (e) { setMod('C', 'failed', e.message); }
    } else setMod('C', 'skipped', 'Not a GitHub or YouTube reference.');

    // Module D
    setMod('D', 'running', 'Looking for corroboration');
    const title = (() => {
      const caps = result.reference.captures.filter((x) => x.check && x.check.title);
      return caps.length ? caps[caps.length - 1].check.title : '';
    })();
    let hn = null;
    try {
      hn = await searchHackerNews(env.net, archiveUrl, title, c, settings);
      result.leads = hn.leads;
      result.hn = { status: hn.status, notes: hn.notes };
    } catch (e) { result.hn = { status: 'failed', notes: [e.message] }; }
    result.links = buildSearchLinks({ url: archiveUrl, title, features: c.features, cutoff: c.cutoff });
    for (const raw of (c.corroborating || []).map((u) => u.trim()).filter(Boolean)) {
      const n2 = normaliseInputUrl(raw);
      const entry = { url: raw, captures: [], notes: [] };
      if (!n2.ok) { entry.notes.push(n2.error); result.corroborating.push(entry); continue; }
      entry.url = n2.url;
      try {
        const a = await findSnapshots(env.net, n2.url, c);
        Object.assign(entry, a);
        if (a.captures.length) {
          const b = await checkFeatures(env.net, a.captures, c.features, settings, envB, { count: 3, refine: false });
          entry.checkNotes = b.notes;
        }
      } catch (e) { entry.notes.push(e.message); }
      result.corroborating.push(entry);
    }
    const hnCount = hn ? hn.sources.length : 0;
    setMod('D', 'done', `${hnCount} Hacker News post${hnCount === 1 ? '' : 's'} counted, ${result.leads.length} lead${result.leads.length === 1 ? '' : 's'}. ${result.corroborating.length} corroborating URL${result.corroborating.length === 1 ? '' : 's'} checked.`);

    // Collect sources and grade (Module E)
    result.sources = [
      ...waybackSources(result.reference.captures, 'reference', archiveUrl),
      ...cSources,
      ...(hn ? hn.sources : []),
      ...result.corroborating.flatMap((e) => waybackSources(e.captures || [], 'corroborating', e.url))
    ];
    result.features = c.features;
    result.grade = gradeCase(result.sources, c.features);
    setMod('E', 'done', `Grade ${result.grade.grade}.`);
    result.finishedAt = new Date().toISOString();
    env.on && env.on.update && env.on.update(result);
    return result;
  }

  // Re-collect sources after captures were checked by hand or candidates were verified.
  // Analyst overrides are kept by source id.
  function rebuildSources(result) {
    const overrides = new Map(result.sources.filter((s) => s.override).map((s) => [sourceId(s), s.override]));
    const keepOther = result.sources.filter((s) => s.kind !== 'wayback');
    result.sources = [
      ...waybackSources(result.reference.captures, 'reference', result.url),
      ...keepOther,
      ...result.corroborating.flatMap((e) => waybackSources(e.captures || [], 'corroborating', e.url)),
      ...(result.candidates || []).filter((cd) => cd.verified).flatMap((cd) => waybackSources(cd.captures || [], 'corroborating', cd.url, { aiFound: true }))
    ];
    for (const s of result.sources) { const o = overrides.get(sourceId(s)); if (o) s.override = o; }
    result.grade = gradeCase(result.sources, result.features || []);
    return result;
  }
  function sourceId(s) { return `${s.kind}|${s.ts || ''}|${s.pageUrl || ''}|${s.url}|${s.date}`; }

  /* Verify URLs proposed by the AI: each is looked up in the Internet Archive and,
     when captures exist, checked for the features. Only this result can count. */
  async function verifyCandidates(urls, caseDef, result, env) {
    const c = { ...caseDef, features: (caseDef.features || []).map(normaliseWhitespace).filter(Boolean) };
    const envB = { ...env, cutoff: c.cutoff, countOnCutoff: c.countOnCutoff };
    const out = [];
    for (const raw of urls) {
      const cand = { url: raw, verified: false, captures: [], notes: [] };
      const n = normaliseInputUrl(raw);
      if (!n.ok) { cand.notes.push(n.error); out.push(cand); continue; }
      cand.url = n.url;
      cand.original = raw;
      if (/vertexaisearch\.cloud\.google\.com\/grounding-api-redirect/.test(n.url)) {
        // Google Search grounding returns redirect links. A browser cannot read where they lead,
        // but the proxy Worker can: it returns the Location header without fetching the target.
        try {
          const res = await env.net.get(n.url, { forceProxy: true, label: 'Resolve a search redirect' });
          const loc = res.ok ? (res.json().location || '') : '';
          const n2 = normaliseInputUrl(loc);
          if (!n2.ok) throw new Error('no location');
          cand.resolvedFrom = n.url;
          cand.url = n2.url;
        } catch (e) {
          cand.notes.push('This is a Google redirect link that could not be resolved here (it needs the proxy). Open it, then add the real address as a corroborating URL.');
          cand.redirect = true;
          out.push(cand);
          continue;
        }
      }
      try {
        const a = await findSnapshots(env.net, cand.url, c);
        cand.captures = a.captures;
        cand.notes.push(...a.notes);
        if (a.captures.some((x) => x.before)) {
          await checkFeatures(env.net, a.captures, c.features, env.settings, envB, { count: 3, refine: false });
          cand.verified = true;
        } else if (a.captures.length) cand.notes.push('The Internet Archive has captures only after the cut-off, so the date could not be verified.');
      } catch (e) { cand.notes.push(e.message); }
      out.push(cand);
    }
    return out;
  }

  /* -------------------------------------------------------------------
     AI layer (Google Gemini, generateContent). AI output is never evidence.
     ------------------------------------------------------------------- */
  const AI_SYSTEM_INSTRUCTIONS = [
    'You assist a patent research analyst who must show that a non-patent reference was public before a cut-off date.',
    'Rules you must follow:',
    '1. Use only the material supplied in this request, unless the task explicitly allows web search or reading URLs.',
    '2. Quote text exactly as it appears. Never paraphrase inside a quotation.',
    '3. If you cannot find something, answer "not found" rather than guess.',
    '4. Never invent URLs, dates, titles or authors.',
    '5. When a JSON schema is given, return only JSON that matches it, with no other text.'
  ].join('\n');

  const AI_TASKS = {
    match: {
      title: 'Find sentences that disclose each feature',
      instruction: 'Task: for each feature statement, list the numbered sentences that disclose it. Use the sentence numbers exactly as given and copy the quotation exactly from that sentence. Give verdict "present" only if the sentence clearly discloses the feature, "possible" if it partly does, and omit sentences that do not.',
      schema: { type: 'object', required: ['matches'], properties: { matches: { type: 'array', items: { type: 'object', required: ['feature', 'sentence_id', 'quote', 'verdict', 'reason'],
        properties: { feature: { type: 'integer' }, sentence_id: { type: 'integer' }, quote: { type: 'string' }, verdict: { type: 'string', enum: ['present', 'possible', 'not found'] }, reason: { type: 'string' } } } } } }
    },
    findSources: {
      title: 'Find other places where the content was published',
      instruction: 'Task: use Google Search to find public web pages that published the same content, or announced it, and that may have been public before the cut-off date. Prefer primary sources: the publisher\'s changelog or release notes, press releases, documentation, forum or mailing-list posts, the publisher\'s social posts, app-store version histories. For each page give its exact URL as shown in the search results, the date the page itself states (or "not stated"), and one line on why it is relevant. If you find nothing, say so.',
      extractInstruction: 'Task: convert the research notes below into JSON. Copy each URL exactly as written in the notes. Do not add any URL that is not in the notes. Use "not stated" when the notes give no date.',
      schema: { type: 'object', required: ['candidates'], properties: { candidates: { type: 'array', items: { type: 'object', required: ['url', 'title', 'claimed_date', 'why'],
        properties: { url: { type: 'string' }, title: { type: 'string' }, claimed_date: { type: 'string' }, why: { type: 'string' } } } } } }
    },
    queries: {
      title: 'Suggest searches and corroboration routes',
      instruction: 'Task: suggest 5 to 8 specific search queries and corroboration routes an analyst could use to prove the reference was public before the cut-off date, for example the uploader\'s other social accounts, the product\'s update logs, a press release, a forum announcement. Do not claim that any result exists.',
      schema: { type: 'object', required: ['queries'], properties: { queries: { type: 'array', items: { type: 'object', required: ['query', 'route', 'why'],
        properties: { query: { type: 'string' }, route: { type: 'string' }, why: { type: 'string' } } } } } }
    },
    readArchived: {
      title: 'Read archived pages the tool could not fetch',
      instruction: 'Task: read the archived web pages at the URLs given, using the URL context tool. For each page and each feature statement say whether the page text discloses the feature, and quote the relevant text exactly. If a page cannot be read, say so for that page.',
      extractInstruction: 'Task: convert the notes below into JSON. Copy URLs and quotations exactly as written in the notes.',
      schema: { type: 'object', required: ['readings'], properties: { readings: { type: 'array', items: { type: 'object', required: ['url', 'feature', 'verdict', 'quote', 'note'],
        properties: { url: { type: 'string' }, feature: { type: 'integer' }, verdict: { type: 'string', enum: ['present', 'possible', 'not found', 'unreadable'] }, quote: { type: 'string' }, note: { type: 'string' } } } } } }
    },
    summary: {
      title: 'Draft a summary of the verified evidence',
      instruction: 'Task: write a plain-English summary of 120 to 200 words for a patent analyst, using only the verified evidence table below. State the grade and why, the key date, and the main limitation. Do not mention any URL or date that is not in the table.'
    }
  };

  function upperTypes(schema) {
    if (!schema || typeof schema !== 'object') return schema;
    const out = Array.isArray(schema) ? [] : {};
    for (const [k, v] of Object.entries(schema)) out[k] = k === 'type' && typeof v === 'string' ? v.toUpperCase() : upperTypes(v);
    return out;
  }

  function buildGeminiBody({ system, user, schema, tool, schemaField = 'responseJsonSchema' }) {
    const body = { systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }] };
    if (tool === 'search') body.tools = [{ google_search: {} }];
    if (tool === 'url') body.tools = [{ url_context: {} }];
    if (schema && !tool) body.generationConfig = { responseMimeType: 'application/json', [schemaField]: schemaField === 'responseSchema' ? upperTypes(schema) : schema };
    return body;
  }

  function parseGeminiResponse(data) {
    const cand = data && data.candidates && data.candidates[0];
    if (!cand) {
      const br = data && data.promptFeedback && data.promptFeedback.blockReason;
      throw new NetError('ai-blocked', br ? `Gemini blocked the request (${br}).` : 'Gemini returned no answer.');
    }
    if (['SAFETY', 'BLOCKLIST', 'PROHIBITED_CONTENT', 'SPII', 'RECITATION'].includes(cand.finishReason)) {
      throw new NetError('ai-blocked', `Gemini stopped the answer (${cand.finishReason}).`);
    }
    const text = ((cand.content && cand.content.parts) || []).filter((p) => p.text && !p.thought).map((p) => p.text).join('');
    const gm = cand.groundingMetadata || {};
    const grounding = (gm.groundingChunks || []).map((ch) => ch.web).filter(Boolean).map((w) => ({ uri: w.uri, title: w.title || '' }));
    const urlMeta = ((cand.urlContextMetadata && cand.urlContextMetadata.urlMetadata) || []).map((u) => ({ url: u.retrievedUrl, status: u.urlRetrievalStatus }));
    return { text, grounding, queries: gm.webSearchQueries || [], urlMeta, usage: data.usageMetadata || null, finishReason: cand.finishReason };
  }

  function parseJsonLoose(text) {
    const t = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    return JSON.parse(t);
  }

  function geminiErrorMessage(status, data, model) {
    const msg = (data && data.error && data.error.message) || '';
    if (status === 400 && /API key not valid/i.test(msg)) return 'The Gemini API key is not valid.';
    if (status === 403) return 'This key may not use the Gemini API. Check the key\'s API restrictions in Google Cloud Console.';
    if (status === 404) return `The model "${model}" was not found. Check the model ID in Settings.`;
    if (status === 429) return 'The Gemini quota or rate limit has been reached. Wait a minute and try again.';
    return `Gemini answered ${status}${msg ? ': ' + msg.slice(0, 160) : ''}.`;
  }

  /* One Gemini call. The key goes in a header, never in the URL. */
  async function geminiGenerate(net, settings, { system, user, schema, tool, label }) {
    const model = String(settings.geminiModel || DEFAULT_SETTINGS.geminiModel).trim();
    const url = `${GEMINI_ENDPOINT}${encodeURIComponent(model)}:generateContent`;
    let field = 'responseJsonSchema';
    for (let attempt = 0; attempt < 2; attempt++) {
      const body = buildGeminiBody({ system, user, schema, tool, schemaField: field });
      const res = await net.request(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': settings.geminiKey },
        body: JSON.stringify(body), timeoutMs: 60000, label: `Gemini: ${label}` });
      let data = null;
      try { data = res.json(); } catch (e) { data = null; }
      if (res.ok) return { ...parseGeminiResponse(data), model };
      // Older models only accept the OpenAPI-style responseSchema field.
      if (res.status === 400 && field === 'responseJsonSchema' && /responseJsonSchema|response_json_schema/i.test(JSON.stringify(data || {}))) { field = 'responseSchema'; continue; }
      throw new NetError('ai-http', geminiErrorMessage(res.status, data, model), { status: res.status });
    }
  }

  /* Structured AI task with validation: one stricter retry, then a clean failure. */
  async function geminiJson(net, settings, { taskKey, user, tool }) {
    const task = AI_TASKS[taskKey];
    const system = `${AI_SYSTEM_INSTRUCTIONS}\n\n${task.instruction}`;
    let first = null;
    let notes = '';
    if (tool) {
      // Grounded or URL-reading call first (free text), then a separate extraction call with the schema.
      first = await geminiGenerate(net, settings, { system, user, tool, label: `${task.title} (${tool === 'search' ? 'Google Search' : 'URL context'})` });
      notes = first.text;
    }
    const extractSystem = tool ? `${AI_SYSTEM_INSTRUCTIONS}\n\n${task.extractInstruction}` : system;
    const extractUser = tool ? `Notes:\n${notes}\n\nGrounding sources listed by the search tool:\n${(first.grounding || []).map((g) => `- ${g.title}: ${g.uri}`).join('\n') || '(none)'}` : user;
    let raw = '';
    for (let attempt = 0; attempt < 2; attempt++) {
      const strict = attempt ? '\n\nYour previous answer was not valid JSON for the schema. Return only the JSON object, nothing else.' : '';
      const r = await geminiGenerate(net, settings, { system: extractSystem + strict, user: extractUser, schema: task.schema, label: task.title });
      raw = r.text;
      try {
        const value = parseJsonLoose(raw);
        const errs = validateSchema(value, task.schema);
        if (!errs.length) return { value, raw, first, usage: r.usage, model: r.model };
      } catch (e) { /* retry once */ }
    }
    throw new NetError('ai-invalid', 'The AI answer did not match the expected format after one retry.', { raw });
  }

  // Dates written in an AI draft must exist in the evidence table.
  const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  function datesInText(text) {
    const out = new Set();
    const t = String(text || '');
    for (const m of t.matchAll(/\b(\d{4})-(\d{2})-(\d{2})\b/g)) out.add(`${m[1]}-${m[2]}-${m[3]}`);
    for (const m of t.matchAll(/\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})\b/gi)) out.add(`${m[3]}-${pad(MONTHS.indexOf(m[2].toLowerCase()) + 1)}-${pad(+m[1])}`);
    for (const m of t.matchAll(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),?\s+(\d{4})\b/gi)) out.add(`${m[3]}-${pad(MONTHS.indexOf(m[1].toLowerCase()) + 1)}-${pad(+m[2])}`);
    return [...out];
  }
  function checkSummaryDraft(text, allowedUrls, allowedDates) {
    const problems = [];
    for (const u of String(text || '').match(/https?:\/\/[^\s)>\]"']+/g) || []) {
      const clean = u.replace(/[.,;:]+$/, '');
      if (!allowedUrls.some((a) => a === clean || sameDocument(a, clean))) problems.push(`URL not in the table: ${clean}`);
    }
    for (const d of datesInText(text)) if (!allowedDates.includes(d)) problems.push(`Date not in the table: ${d}`);
    return problems;
  }

  /* User messages for each AI task. Only public case data is included; the
     analyst's notes are never sent. */
  function aiUserText(taskKey, ctx) {
    const feats = (ctx.features || []).map((f, i) => `${i}: ${f}`).join('\n');
    const head = `Cut-off date: ${ctx.cutoff}\nReference: ${ctx.url || '(none)'}${ctx.title ? `\nPage title: ${ctx.title}` : ''}${ctx.extra ? `\n${ctx.extra}` : ''}\nFeature statements:\n${feats}`;
    if (taskKey === 'match') {
      const blocks = ctx.blocks.map((b) => `Capture of ${b.date} (${b.url}):\n${b.sentences.map((s) => `${s.id}: ${s.text}`).join('\n')}`).join('\n\n');
      return `${head}\n\nNumbered sentences, extracted by the tool from archived pages it fetched itself${ctx.truncated ? ' (shortened: only the sentences most similar to the features are included)' : ''}:\n\n${blocks}`;
    }
    if (taskKey === 'readArchived') return `${head}\n\nArchived pages to read:\n${ctx.urls.map((u) => `- ${u}`).join('\n')}`;
    if (taskKey === 'summary') {
      const rows = ctx.rows.map((r) => `- ${r.label} | ${r.party} (${r.cls}) | ${r.date} | ${r.before ? 'before' : 'after'} the cut-off | features: ${r.features} | ${r.url}`).join('\n');
