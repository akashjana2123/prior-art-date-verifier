<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prior-Art Date Verifier</title>
<meta name="description" content="Checks whether a web page, video or repository was public before a patent's cut-off date, and builds a dated evidence dossier.">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='5' width='22' height='22' rx='2' fill='none' stroke='%2317202b' stroke-width='3'/%3E%3Crect x='14.5' y='1' width='3' height='30' fill='%23b42318'/%3E%3C/svg%3E">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eceff3;
  --ink: #17202b;
  --ink-2: #4b5666;
  --ink-3: #6b7685;
  --rule: #d5dbe2;
  --accent: #5e2a73;
  --accent-ink: #ffffff;
  --accent-soft: #f2e9f5;
  --cutoff: #b42318;
  --present: #1e7a3c;
  --possible: #9a5b00;
  --unchecked: #aab3bf;
  --g-a: #1e7a3c; --g-a-soft: #e5f3ea;
  --g-b: #1d5fb8; --g-b-soft: #e6eefa;
  --g-c: #9a5b00; --g-c-soft: #fbf0e0;
  --g-d: #b42318; --g-d-soft: #fbe9e7;
  --focus: #5e2a73;
  --radius-s: 4px;
  --radius-m: 8px;
  --shadow: 0 1px 2px rgba(23, 32, 43, 0.06), 0 4px 16px rgba(23, 32, 43, 0.06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1a2129; --surface-2: #232c36; --ink: #e8ecf1; --ink-2: #b3bcc8; --ink-3: #8d98a6;
    --rule: #303b47; --accent: #d7aee3; --accent-ink: #1a1020; --accent-soft: #2d2233; --cutoff: #ff7b6e;
    --present: #5fcb8c; --possible: #f0b45c; --unchecked: #5d6875;
    --g-a: #5fcb8c; --g-a-soft: #17301f; --g-b: #82b3f7; --g-b-soft: #172438; --g-c: #f0b45c; --g-c-soft: #33260f;
    --g-d: #ff7b6e; --g-d-soft: #3a1a17; --focus: #d7aee3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a2129; --surface-2: #232c36; --ink: #e8ecf1; --ink-2: #b3bcc8; --ink-3: #8d98a6;
  --rule: #303b47; --accent: #d7aee3; --accent-ink: #1a1020; --accent-soft: #2d2233; --cutoff: #ff7b6e;
  --present: #5fcb8c; --possible: #f0b45c; --unchecked: #5d6875;
  --g-a: #5fcb8c; --g-a-soft: #17301f; --g-b: #82b3f7; --g-b-soft: #172438; --g-c: #f0b45c; --g-c-soft: #33260f;
  --g-d: #ff7b6e; --g-d-soft: #3a1a17; --focus: #d7aee3; color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
[v-cloak] { display: none; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
.num, time, .date { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Controls ---------- */
button, .btn {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius-s); padding: 6px 12px; cursor: pointer; line-height: 1.3; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
button:hover:not(:disabled), .btn:hover { border-color: var(--ink-3); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
button.quiet:hover:not(:disabled) { color: var(--ink); border-color: var(--rule); }
button.danger { color: var(--g-d); }
label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.check-label { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; color: var(--ink); font-size: 14px; }
.check-label input { margin-top: 3px; }
input[type="text"], input[type="url"], input[type="date"], input[type="number"], input[type="password"], select, textarea {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); width: 100%;
  border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 7px 9px;
}
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:disabled, textarea:disabled, select:disabled { background: var(--surface-2); color: var(--ink-2); }
.field + .field { margin-top: 12px; }
.hint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.error-text { font-size: 13px; color: var(--g-d); margin-top: 4px; }

/* ---------- App shell ---------- */
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 3px; position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; left: 11px; top: -5px; bottom: -5px; width: 2px; background: var(--cutoff); }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.version { font-size: 12px; color: var(--ink-3); }
.segmented { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius-s); overflow: hidden; }
.segmented button { border: 0; border-radius: 0; padding: 6px 12px; background: var(--surface); }
.segmented button + button { border-left: 1px solid var(--rule); }
.segmented button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.top-actions { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.count { font-size: 12px; background: var(--surface-2); border-radius: 10px; padding: 0 6px; color: var(--ink-2); }

.banner { padding: 10px 20px; font-size: 14px; border-bottom: 1px solid var(--rule); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.banner.demo { background: var(--accent-soft); }
.banner.warn { background: var(--g-c-soft); }

.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: calc(100vh - 54px); }
.sidebar { border-right: 1px solid var(--rule); background: var(--surface); padding: 18px 18px 40px; }
.main { padding: 22px 28px 60px; min-width: 0; }
@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--rule); }
  .main { padding: 18px 16px 48px; }
  .topbar { padding: 10px 16px; }
}
@media (max-width: 640px) {
  .topbar { position: static; gap: 8px 12px; }
  .version { display: none; }
  .top-actions { margin-left: 0; width: 100%; }
  .top-actions button { padding: 6px 8px; }
}

/* ---------- Sidebar ---------- */
.side-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.side-head h2 { font-size: 15px; }
.case-list { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 4px; }
.case-item {
  width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px;
  border: 1px solid transparent; border-radius: var(--radius-s); background: transparent;
}
.case-item:hover { background: var(--surface-2); border-color: transparent; }
.case-item[aria-current="true"] { background: var(--surface-2); border-color: var(--rule); }
.case-item .name { font-weight: 600; font-size: 14px; }
.case-item .meta { font-size: 12.5px; color: var(--ink-2); grid-column: 1; }
.case-item .grade-chip { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.form-block { border-top: 1px solid var(--rule); padding-top: 16px; }
.form-block h3 { font-size: 14px; margin-bottom: 12px; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.form-actions .primary { flex: 1 1 100%; justify-content: center; padding: 9px 12px; }
.note-box { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--radius-s); padding: 8px 10px; margin-bottom: 12px; }

/* ---------- Grade chips and pills ---------- */
.grade-chip { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 4px; font-weight: 800; font-size: 13px; padding: 0 6px; border: 1.5px solid currentColor; }
.g-A { color: var(--g-a); } .g-B { color: var(--g-b); } .g-C { color: var(--g-c); } .g-D { color: var(--g-d); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.done { background: var(--g-a-soft); color: var(--g-a); }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.failed, .pill.blocked, .pill.empty { background: var(--g-d-soft); color: var(--g-d); }
.pill.skipped, .pill.waiting { background: var(--surface-2); color: var(--ink-2); }
.pill.rate-limited { background: var(--g-c-soft); color: var(--g-c); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink-3); flex: none; }
.dot.present { background: var(--present); border-color: var(--present); }
.dot.possible { background: transparent; border: 2px dashed var(--possible); }
.dot.absent { background: transparent; border-color: var(--ink-2); }
.dot.unchecked { background: var(--unchecked); border-color: var(--unchecked); }
.tag { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); }
.tag.ai { background: var(--g-c-soft); color: var(--g-c); }
.tag.demo { background: var(--accent-soft); color: var(--accent); }

/* ---------- Main: case header and tabs ---------- */
.case-head { margin-bottom: 16px; }
.case-head h1 { font-size: 22px; letter-spacing: -0.01em; }
.case-head .facts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.case-head .facts strong { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 9px 14px; color: var(--ink-2); font-weight: 600; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-select { display: none; margin-bottom: 16px; }
@media (max-width: 640px) { .tabs { display: none; } .tab-select { display: block; } }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 18px 20px; }
.panel + .panel { margin-top: 16px; }
.panel h2 { font-size: 16px; margin-bottom: 12px; }
.panel h3 { font-size: 14.5px; margin-bottom: 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.grid-2 > .panel + .panel { margin-top: 0; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

.empty { text-align: center; padding: 48px 20px; color: var(--ink-2); }
.empty h2 { color: var(--ink); font-size: 18px; margin-bottom: 8px; }
.empty p { max-width: 52ch; margin: 0 auto 16px; }

/* ---------- Verdict (the one bold element) ---------- */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 24px; align-items: stretch; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); overflow: hidden; }
.verdict-letter {
  font-size: 76px; font-weight: 800; line-height: 1; width: 132px; display: grid; place-items: center; position: relative;
  background: var(--g-d-soft); color: var(--g-d); border-right: 1px solid var(--rule); padding: 18px 0;
}
.verdict-letter::after { content: ""; position: absolute; right: -1px; top: 0; bottom: 0; width: 4px; background: currentColor; }
.verdict.verdict-A .verdict-letter { background: var(--g-a-soft); color: var(--g-a); }
.verdict.verdict-B .verdict-letter { background: var(--g-b-soft); color: var(--g-b); }
.verdict.verdict-C .verdict-letter { background: var(--g-c-soft); color: var(--g-c); }
.verdict-body { padding: 18px 20px 18px 0; min-width: 0; }
.verdict-body .grade-name { font-size: 20px; font-weight: 700; color: var(--ink); }
.verdict-body .reason { margin-top: 6px; color: var(--ink-2); max-width: 75ch; }
.verdict-body .keydate { margin-top: 12px; font-size: 14px; }
.verdict-body .keydate strong { font-size: 16px; }
.verdict.running .verdict-letter { background: var(--surface-2); color: var(--ink-3); }
@media (max-width: 640px) {
  .verdict { grid-template-columns: 1fr; }
  .verdict-letter { width: auto; font-size: 56px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .verdict-letter::after { left: 0; right: 0; top: auto; bottom: -1px; width: auto; height: 4px; }
  .verdict-body { padding: 14px 16px; }
}

/* ---------- Lists and tables ---------- */
.module-list { list-style: none; margin: 0; padding: 0; }
.module-list li { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.module-list li:last-child { border-bottom: 0; }
.module-list .letter { font-weight: 800; color: var(--ink-3); font-size: 13px; }
.module-list .mname { font-weight: 600; font-size: 14px; }
.module-list .msg { grid-column: 2 / span 2; font-size: 13px; color: var(--ink-2); }
.actions-list { margin: 0; padding-left: 18px; }
.actions-list li + li { margin-top: 6px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
tr.selected td { background: var(--accent-soft); }
tr.after td { color: var(--ink-3); }
tbody tr:hover td { background: var(--surface-2); }
td.num { white-space: nowrap; }
td .sub { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

/* ---------- Timeline ---------- */
.timeline-wrap { position: relative; overflow-x: auto; }
.timeline-inner { position: relative; min-width: 640px; }
.timeline svg { display: block; width: 100%; height: auto; }
.timeline .lane-label { font-size: 12px; fill: var(--ink-2); }
.timeline svg { overflow: visible; }
.timeline .lane-line { stroke: var(--rule); }
.timeline .tick text { font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.timeline .tick line { stroke: var(--rule); }
.timeline .cutoff-line { stroke: var(--cutoff); stroke-width: 2.5; }
.timeline .cutoff-label { fill: var(--cutoff); font-size: 12px; font-weight: 700; }
.timeline .after-zone { fill: var(--surface-2); opacity: 0.6; }
.timeline .mark { cursor: pointer; outline: none; }
.timeline .mark .shape { stroke-width: 1.8; }
.timeline .mark.present .shape { fill: var(--present); stroke: var(--present); }
.timeline .mark.possible .shape { fill: var(--surface); stroke: var(--possible); stroke-dasharray: 2.5 2; stroke-width: 2.2; }
.timeline .mark.absent .shape { fill: var(--surface); stroke: var(--ink-2); }
.timeline .mark.unchecked .shape { fill: var(--unchecked); stroke: var(--unchecked); }
.timeline .mark.after { opacity: 0.55; }
.timeline .mark:focus-visible .halo, .timeline .mark:hover .halo, .timeline .mark.selected .halo { stroke: var(--focus); stroke-width: 2; fill: none; }
.timeline .halo { stroke: transparent; fill: none; }
.tooltip {
  position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--ink); color: var(--surface);
  font-size: 12.5px; padding: 6px 9px; border-radius: var(--radius-s); max-width: 280px; white-space: normal; box-shadow: var(--shadow);
}
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 14px; height: 14px; }

/* ---------- Feature match ---------- */
.capture-card { border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 14px 16px; background: var(--surface); }
.capture-card + .capture-card { margin-top: 12px; }
.capture-card header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.capture-card header .date { font-weight: 700; }
.feature-row { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 10px; }
.feature-row:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.feature-name { font-size: 13px; color: var(--ink-2); }
.sentences { list-style: none; margin: 8px 0 0; padding: 0; }
.sentences li { font-size: 14px; padding: 6px 10px; border-left: 3px solid var(--rule); background: var(--surface-2); border-radius: 0 var(--radius-s) var(--radius-s) 0; }
.sentences li + li { margin-top: 6px; }
.sentences li.top { border-left-color: var(--accent); }
.sentences mark { background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.scores { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.override { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.override button { font-size: 12.5px; padding: 3px 9px; }
.ai-box { border: 1px dashed var(--g-c); border-radius: var(--radius-m); padding: 12px 14px; background: var(--g-c-soft); }
.ai-box + .ai-box { margin-top: 10px; }
.ai-box .ai-label { font-size: 12.5px; font-weight: 700; color: var(--g-c); }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details[open] summary { margin-bottom: 8px; }
pre { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; background: var(--surface-2); padding: 10px; border-radius: var(--radius-s); max-height: 360px; overflow: auto; margin: 0; }

/* ---------- Modals ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(10, 14, 20, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: var(--radius-m); box-shadow: var(--shadow); }
.modal.wide { width: min(1100px, 100%); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 18px 20px 22px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--rule); }
.settings-group + .settings-group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule); }
.settings-group h3 { font-size: 15px; margin-bottom: 10px; }
.fields-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .fields-2 { grid-template-columns: 1fr; } }
.notice { font-size: 13.5px; padding: 10px 12px; border-radius: var(--radius-s); background: var(--g-c-soft); color: var(--ink); border-left: 3px solid var(--g-c); }

/* ---------- Report ---------- */
.report { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 32px 40px; max-width: 900px; }
.report h1 { font-size: 22px; }
.report h2 { font-size: 16px; margin: 26px 0 10px; padding-top: 14px; border-top: 1px solid var(--rule); }
.report .lead { color: var(--ink-2); margin-top: 6px; }
.report dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.report dt { color: var(--ink-2); }
.report dd { margin: 0; }
.report .quote { border-left: 3px solid var(--accent); padding: 6px 12px; margin: 8px 0; background: var(--surface-2); font-size: 14px; }
.report ul { padding-left: 20px; }
.report-actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
@media (max-width: 640px) { .report { padding: 20px 16px; } .report dl { grid-template-columns: 1fr; } }

@media print {
  @page { size: A4; margin: 16mm 14mm; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .topbar, .banner, .sidebar, .tabs, .tab-select, .case-head, .report-actions, .modal-backdrop, .no-print { display: none !important; }
  .layout { display: block; }
  .main { padding: 0; }
  .report { border: 0; padding: 0; max-width: none; }
  .report h2 { break-after: avoid; }
  .report table, .report .quote, .report .timeline { break-inside: avoid; }
  a { color: #000; }
  .timeline-inner { min-width: 0; }
}

</style>
</head>
<body>
<noscript><p style="padding:20px">This tool needs JavaScript.</p></noscript>
<div id="fatal" class="banner warn" hidden role="alert"></div>
<div id="app"><p style="padding:24px;color:#4b5666">Loading Prior-Art Date Verifier…</p></div>

<script type="text/x-template" id="timeline-template">
  <div class="timeline" v-if="model">
    <div class="timeline-wrap">
      <div class="timeline-inner" :style="{ minWidth: model.compact ? '520px' : '680px' }">
        <svg :viewBox="'0 0 ' + model.W + ' ' + model.H" role="group" :aria-label="'Timeline of dated evidence around the cut-off ' + cutoff">
          <rect class="after-zone" :x="model.cutX" :y="model.top - 12" :width="Math.max(model.right - model.cutX + 12, 0)" :height="model.bottom - model.top + 12"></rect>
          <g v-for="t in model.ticks" :key="'t' + t.x" class="tick">
            <line :x1="t.x" :x2="t.x" :y1="model.top - 6" :y2="model.bottom"></line>
            <text :x="t.x" :y="model.bottom + 16" text-anchor="middle">{{ t.label }}</text>
          </g>
          <g v-for="lane in model.lanes" :key="lane.key">
            <line class="lane-line" :x1="model.left" :x2="model.right" :y1="lane.y" :y2="lane.y"></line>
            <text v-if="model.left > 20" class="lane-label" x="0" :y="lane.y + 4">{{ lane.label }}</text>
          </g>
          <line class="cutoff-line" :x1="model.cutX" :x2="model.cutX" :y1="model.top - 16" :y2="model.bottom"></line>
          <text class="cutoff-label" :x="model.cutX + (model.cutX + 140 > model.W ? -6 : 6)" :text-anchor="model.cutX + 140 > model.W ? 'end' : 'start'" :y="model.top - 8">Cut-off {{ cutoff }}</text>
          <g v-for="m in model.marks" :key="m.id" class="mark" :class="[m.status, { after: m.after, selected: m.id === selected }]"
             :tabindex="m.status === 'unchecked' && m.s.kind === 'wayback' ? -1 : 0" role="button" :aria-label="m.label"
             @mouseenter="tip(m)" @mouseleave="untip" @focus="tip(m)" @blur="untip"
             @click="$emit('open', m)" @keydown.enter.prevent="$emit('open', m)" @keydown.space.prevent="$emit('open', m)">
            <circle class="halo" :cx="m.x" :cy="m.y" r="10"></circle>
            <path class="shape" :d="m.d"></path>
          </g>
        </svg>
        <div v-if="tooltip" class="tooltip" role="tooltip" :style="{ left: tooltip.left, top: tooltip.top }">{{ tooltip.text }}</div>
      </div>
    </div>
    <div class="legend" v-if="showLegend">
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--present)" stroke="var(--present)"></circle></svg> Feature present</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--possible)" stroke-width="2" stroke-dasharray="2.5 2"></circle></svg> Possibly present</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--ink-2)" stroke-width="1.8"></circle></svg> Not found</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--unchecked)"></circle></svg> Not checked</span>
      <span><svg viewBox="0 0 14 14"><path d="M7,1 L13,7 L7,13 L1,7 Z" fill="none" stroke="var(--ink-2)" stroke-width="1.6"></path></svg> Platform date</span>
      <span><svg viewBox="0 0 14 14"><path d="M7,1 L13,12 L1,12 Z" fill="none" stroke="var(--ink-2)" stroke-width="1.6"></path></svg> Self-reported date</span>
      <span><svg viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="none" stroke="var(--ink-2)" stroke-width="1.6"></rect></svg> Third-party post</span>
      <span><svg viewBox="0 0 14 14"><line x1="7" y1="0" x2="7" y2="14" stroke="var(--cutoff)" stroke-width="2.5"></line></svg> Cut-off</span>
    </div>
  </div>
</script>

<script type="text/x-template" id="app-template">
  <div class="sr-only" aria-live="polite">{{ ui.live }}</div>
  <span hidden>{{ version }}</span>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Prior-Art Date Verifier</span>
      <span class="version">v{{ appVersion }}</span>
    </div>
    <div class="segmented" role="group" aria-label="Data source">
      <button type="button" :aria-pressed="mode === 'live'" @click="setMode('live')">Live</button>
      <button type="button" :aria-pressed="mode === 'demo'" @click="setMode('demo')">Demo (cached)</button>
    </div>
    <div class="top-actions">
      <button type="button" class="quiet" @click="cycleTheme" :aria-label="'Theme: ' + theme + '. Change theme'">Theme: {{ theme === 'auto' ? 'system' : theme }}</button>
      <button type="button" class="quiet" @click="ui.modal = 'settings'">Settings</button>
      <button type="button" class="quiet" @click="ui.modal = 'log'">Request log <span class="count num">{{ logs.length }}</span></button>
      <button type="button" class="quiet" @click="ui.modal = 'about'">About</button>
    </div>
  </header>

  <div v-if="mode === 'demo'" class="banner demo">
    <strong>Demo mode.</strong>
    <span>Every request is answered from real responses cached on {{ demoCaptured || 'the build date' }}, so the demo works offline. Switch to Live to query the services now.</span>
  </div>
  <div v-else-if="isLocalFile && !settings.proxyPrefix" class="banner warn">
    <strong>Opened as a local file.</strong>
    <span>The Internet Archive refuses requests from local files, so archive dates will be missing in live mode. Open the published site, or serve this folder (python -m http.server), or add a proxy in Settings. GitHub, Software Heritage, Hacker News, YouTube and Gemini still work.</span>
  </div>
  <div v-else-if="!settings.proxyPrefix" class="banner warn">
    <strong>Live mode without a proxy.</strong>
    <span>web.archive.org does not allow requests from web pages, so captures are sampled through the availability API and archived pages cannot be read. Add a proxy in Settings for full results.</span>
  </div>
  <div v-if="!storeOk" class="banner warn"><span>This browser does not allow storage here, so cases are kept only until the page is closed.</span></div>

  <div class="layout">
    <!-- ============ Sidebar: cases and the case form ============ -->
    <aside class="sidebar" aria-label="Cases">
      <div class="side-head">
        <h2>Cases</h2>
        <span class="spacer"></span>
        <button type="button" @click="newCase">New case</button>
      </div>
      <ul class="case-list">
        <li v-for="c in cases" :key="c.id">
          <button type="button" class="case-item" :aria-current="c.id === selectedId" @click="selectCase(c.id)">
            <span class="name">{{ c.name || 'Untitled case' }}</span>
            <span class="meta">
              <span v-if="c.demo" class="tag demo">Demo</span>
              Cut-off <span class="num">{{ c.cutoff || 'not set' }}</span>
            </span>
            <span v-if="c.last" class="grade-chip" :class="'g-' + c.last.grade" :aria-label="'Last grade ' + c.last.grade">{{ c.last.grade }}</span>
          </button>
        </li>
      </ul>

      <section v-if="selected" class="form-block" aria-label="Case details">
        <h3>Case details</h3>
        <p v-if="selected.demo" class="note-box">Demo cases are read-only so that every request stays in the cache. Duplicate one to edit it.</p>
        <fieldset :disabled="selected.demo || ui.running" style="border:0;margin:0;padding:0;min-width:0">
          <div class="field">
            <label for="f-name">Case name</label>
            <input id="f-name" type="text" v-model="selected.name" @change="onEdit">
          </div>
          <div class="field">
            <label for="f-patent">Patent or application number (optional, label only)</label>
            <input id="f-patent" type="text" v-model="selected.patentNo" @change="onEdit" placeholder="For example US 9,999,999 B2">
          </div>
          <div class="field">
            <label for="f-cutoff">Cut-off (priority) date</label>
            <input id="f-cutoff" type="date" v-model="selected.cutoff" @change="onEdit">
            <label class="check-label" style="margin-top:8px">
              <input type="checkbox" v-model="selected.countOnCutoff" @change="onEdit">
              <span>Count captures made on the cut-off date as before</span>
            </label>
          </div>
          <div class="field">
            <label for="f-url">Candidate reference URL</label>
            <input id="f-url" type="url" v-model="selected.url" @change="onEdit" placeholder="https://example.com/changelog" autocomplete="off" spellcheck="false">
            <div class="row" style="margin-top:6px">
              <span class="hint" style="margin:0">Detected: <strong>{{ typeName(detectedType) }}</strong></span>
              <span class="spacer"></span>
              <label for="f-type" class="sr-only">Reference type</label>
              <select id="f-type" v-model="selected.typeOverride" @change="onEdit" style="width:auto">
                <option value="auto">Use detected type</option>
                <option value="web">Web page</option>
                <option value="youtube">YouTube video</option>
                <option value="github">GitHub repository</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="f-features">Claim feature statements, one per line</label>
            <textarea id="f-features" rows="4" v-model="selected.featuresText" @change="onEdit" placeholder="the decoding area can be resized by the user"></textarea>
            <div class="hint">Short statements work best. Each one is matched separately; the grade uses the weakest.</div>
          </div>
          <div class="field">
            <label for="f-corr">Corroborating URLs (optional), one per line</label>
            <textarea id="f-corr" rows="2" v-model="selected.corroboratingText" @change="onEdit" placeholder="https://news.example.com/launch-post" spellcheck="false"></textarea>
          </div>
          <div class="field">
            <label class="check-label">
              <input type="checkbox" v-model="selected.confidential" @change="onEdit">
              <span>Confidential: never send this case to the AI</span>
            </label>
          </div>
          <div class="field">
            <label for="f-notes">Analyst notes (kept in this browser, never sent anywhere)</label>
            <textarea id="f-notes" rows="2" v-model="selected.notes" @change="onEdit"></textarea>
          </div>
        </fieldset>
        <p v-if="ui.formError" class="error-text" role="alert">{{ ui.formError }}</p>
        <div class="form-actions">
          <button type="button" class="primary" :disabled="ui.running" @click="runSelected">{{ ui.running ? 'Checking…' : (result && !result.running ? 'Run the check again' : 'Run the check') }}</button>
          <button type="button" @click="duplicateCase">Duplicate</button>
          <button type="button" @click="exportJson">Export JSON</button>
          <label class="btn" for="f-import" style="margin:0;font-weight:400;color:var(--ink)">Import JSON</label>
          <input id="f-import" type="file" accept="application/json,.json" class="sr-only" @change="importJson">
          <button type="button" class="danger" v-if="!selected.demo" @click="deleteCase">Delete</button>
        </div>
        <p v-if="ui.importError" class="error-text" role="alert">{{ ui.importError }}</p>
      </section>
    </aside>

    <!-- ============ Main area ============ -->
    <main class="main" id="main">
      <div v-if="!selected" class="empty">
        <h2>No case selected</h2>
        <p>Create a case with a reference URL, a cut-off date and the claim features you need to show.</p>
        <button type="button" class="primary" @click="newCase">New case</button>
      </div>

      <template v-else>
        <div class="case-head">
          <h1>{{ selected.name || 'Untitled case' }}</h1>
          <div class="facts">
            <span>Cut-off <strong class="num">{{ selected.cutoff || 'not set' }}</strong>{{ selected.countOnCutoff ? ' (on the day counts as before)' : ' (strictly before)' }}</span>
            <span v-if="selected.patentNo">Patent <strong>{{ selected.patentNo }}</strong></span>
            <span v-if="selected.url">Reference <a :href="selected.url" target="_blank" rel="noopener noreferrer">{{ shortUrl(selected.url) }}</a></span>
            <span v-if="result && result.finishedAt">Checked {{ local(result.finishedAt) }} <span class="tag" :class="{ demo: result.mode === 'demo' }">{{ result.mode === 'demo' ? 'cached data' : 'live data' }}</span></span>
            <span v-if="result && result.imported" class="tag">Imported result</span>
          </div>
        </div>

        <nav class="tabs" role="tablist" aria-label="Result views">
          <button v-for="t in TABS" :key="t.key" type="button" role="tab" :id="'tab-' + t.key" :aria-selected="ui.tab === t.key" :aria-controls="'panel-' + t.key" @click="ui.tab = t.key">{{ t.label }}</button>
        </nav>
        <div class="tab-select">
          <label for="tab-select">View</label>
          <select id="tab-select" v-model="ui.tab"><option v-for="t in TABS" :key="t.key" :value="t.key">{{ t.label }}</option></select>
        </div>

        <div v-if="!result" class="empty panel">
          <h2>Not checked yet</h2>
          <p>The check lists archived captures before the cut-off, reads them for the features, collects platform and third-party dates, and grades the evidence.</p>
          <button type="button" class="primary" :disabled="ui.running" @click="runSelected">Run the check</button>
        </div>

        <!-- ---------- Overview ---------- -->
        <section v-else-if="ui.tab === 'overview'" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
          <div class="verdict" :class="result.running ? 'running' : 'verdict-' + grade.grade">
            <div class="verdict-letter" aria-hidden="true">{{ result.running ? '…' : grade.grade }}</div>
            <div class="verdict-body">
              <template v-if="result.running">
                <div class="grade-name">Checking the evidence</div>
                <p class="reason">{{ runningMessage }}</p>
                <p v-if="ui.modelProgress" class="reason">{{ ui.modelProgress }}</p>
              </template>
              <template v-else>
                <div class="grade-name">Grade {{ grade.grade }}: {{ P.GRADE_TEXT[grade.grade] }}</div>
                <p class="reason">{{ grade.reason }}</p>
                <p class="keydate" v-if="grade.keyDate">Earliest dated evidence showing {{ features.length > 1 ? 'all features' : 'the feature' }} before the cut-off: <strong class="num">{{ fmt(grade.keyDate) }}</strong> <span class="muted">({{ local(grade.keyDate) }} your time)</span></p>
                <p class="keydate muted" v-else>No dated evidence shows {{ features.length > 1 ? 'every feature' : 'the feature' }} before the cut-off.</p>
                <p class="small muted" style="margin-top:8px" v-if="nearCutoff">The key date is within a day of the cut-off. Check the time zone of the priority date.</p>
              </template>
            </div>
          </div>

          <div class="panel" style="margin-top:16px" v-if="miniTimeline && miniTimeline.marks.length">
            <div class="row" style="margin-bottom:8px">
              <h2 style="margin:0">Timeline</h2>
              <span class="spacer"></span>
              <button type="button" class="quiet" @click="ui.tab = 'timeline'">Open the full timeline</button>
            </div>
            <timeline-chart :result="result" :cutoff="selected.cutoff" :zoom="ui.zoom" :compact="true" :version="version" :selected="ui.selectedSource" :show-legend="false" @open="openMark"></timeline-chart>
          </div>

          <div class="grid-2">
            <div class="panel">
              <h2>Modules</h2>
              <ul class="module-list">
                <li v-for="m in MODULES" :key="m.key">
                  <span class="letter">{{ m.key }}</span>
                  <span class="mname">{{ m.name }}</span>
                  <span class="pill" :class="moduleState(m.key).state">{{ stateText(moduleState(m.key).state) }}</span>
                  <span class="msg" v-if="moduleState(m.key).message">{{ moduleState(m.key).message }}</span>
                </li>
              </ul>
            </div>
            <div class="panel">
              <h2>Suggested next steps</h2>
              <ol class="actions-list">
                <li v-for="(a, i) in nextActions" :key="i">{{ a }}</li>
              </ol>
            </div>
          </div>

          <div class="panel" v-if="!result.running">
            <div class="row" style="margin-bottom:6px">
              <h2 style="margin:0">AI assist (Gemini)</h2>
              <span class="tag ai">AI suggests, the tool verifies, the analyst decides</span>
            </div>
            <p class="small muted" style="margin-bottom:12px">AI output is never counted as evidence. URLs it suggests are checked in the Internet Archive by the tool; quotations must appear word for word in text the tool fetched itself.</p>
            <div class="row">
              <button type="button" :disabled="!!ui.aiBusy" @click="runAiTask('findSources')">{{ ui.aiBusy === 'findSources' ? 'Searching…' : 'Find other publications' }}</button>
              <button type="button" :disabled="!!ui.aiBusy" @click="runAiTask('match')">{{ ui.aiBusy === 'match' ? 'Reading…' : 'Check matches with AI' }}</button>
              <button type="button" :disabled="!!ui.aiBusy" @click="runAiTask('queries')">{{ ui.aiBusy === 'queries' ? 'Thinking…' : 'Suggest searches' }}</button>
              <button type="button" v-if="mode === 'live'" :disabled="!!ui.aiBusy" @click="runAiTask('readArchived')">{{ ui.aiBusy === 'readArchived' ? 'Reading…' : 'Read archived pages with AI' }}</button>
            </div>
            <p v-if="ui.aiError" class="error-text" role="alert">{{ ui.aiError }}</p>
            <p v-if="mode === 'demo'" class="hint">In demo mode the AI answers are cached samples, labelled as such; the tool's verification of them runs normally.</p>
            <div v-if="result.aiItems.length" style="margin-top:14px">
              <div v-for="item in result.aiItems" :key="item.id" class="ai-box">
                <div class="row">
                  <span class="ai-label">AI suggestion – unverified</span>
                  <span v-if="item.illustrative" class="tag ai">Illustrative sample – not a real AI response</span>
                  <span class="spacer"></span>
                  <span class="small muted">{{ item.title }}{{ item.model ? ', ' + item.model : '' }}</span>
                </div>
                <template v-if="item.failed">
                  <p class="small" style="margin-top:6px">The answer could not be used.</p>
                  <details><summary>Raw answer</summary><pre>{{ item.raw }}</pre></details>
                </template>
                <template v-else-if="item.kind === 'findSources'">
                  <p class="small" style="margin-top:6px">Candidate pages proposed by the AI. Dates below are claims by the AI, not evidence; the tool's own check is in the last column.</p>
                  <div class="table-wrap" style="margin-top:8px">
                    <table>
                      <thead><tr><th scope="col">Proposed page</th><th scope="col">Date claimed by AI</th><th scope="col">Tool's verification</th></tr></thead>
                      <tbody>
                        <tr v-for="cand in item.candidates" :key="cand.url">
                          <td><a :href="cand.url" target="_blank" rel="noopener noreferrer">{{ cand.title || shortUrl(cand.url) }}</a><span class="sub">{{ cand.why }}</span></td>
                          <td class="num">{{ cand.claimed_date }}</td>
                          <td>{{ candidateVerdict(cand.url) }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <details v-if="item.grounding && item.grounding.length" style="margin-top:8px"><summary>Search sources listed by Gemini ({{ item.grounding.length }})</summary>
                    <ul class="small"><li v-for="g in item.grounding" :key="g.uri"><a :href="g.uri" target="_blank" rel="noopener noreferrer">{{ g.title || g.uri }}</a> – {{ candidateVerdict(g.uri) }}</li></ul>
                  </details>
                </template>
                <template v-else-if="item.kind === 'queries'">
                  <ul class="small" style="margin-top:6px">
                    <li v-for="q in item.queries" :key="q.query"><a :href="q.href" target="_blank" rel="noopener noreferrer">{{ q.query }}</a> – {{ q.route }}. {{ q.why }}</li>
                  </ul>
                </template>
                <template v-else-if="item.kind === 'match'">
                  <p class="small" style="margin-top:6px">{{ item.accepted.length }} quotation{{ item.accepted.length === 1 ? '' : 's' }} found word for word in the fetched text; {{ item.discarded.length }} discarded.</p>
                  <ul class="sentences">
                    <li v-for="(m, i) in item.accepted" :key="'a' + i">“{{ m.sentence }}”
                      <div class="scores">AI-assisted match for feature {{ m.feature + 1 }} ({{ m.verdict }}), capture {{ day(m.captureDate) }}. Lexical score {{ m.lexical.toFixed(2) }}. {{ m.reason }}</div>
                    </li>
                  </ul>
                  <details v-if="item.discarded.length" style="margin-top:8px"><summary>Discarded quotations ({{ item.discarded.length }})</summary>
                    <ul class="small"><li v-for="(d, i) in item.discarded" :key="'d' + i">“{{ d.quote }}” – {{ d.reason }}</li></ul>
                  </details>
                </template>
                <template v-else-if="item.kind === 'readArchived'">
                  <ul class="small" style="margin-top:6px">
                    <li v-for="(rd, i) in item.readings" :key="i">{{ shortUrl(rd.url) }}, feature {{ rd.feature + 1 }}: {{ rd.verdict }}{{ rd.quote ? ' – “' + rd.quote + '”' : '' }} <span class="muted">{{ rd.note }}</span></li>
                  </ul>
                  <p class="small muted">The tool could not fetch these pages itself, so these readings cannot be verified here. Open the captures and read them.</p>
                </template>
              </div>
            </div>
          </div>
        </section>

        <!-- ---------- Timeline ---------- -->
        <section v-else-if="ui.tab === 'timeline'" id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline">
          <div class="panel">
            <div class="row" style="margin-bottom:12px">
              <h2 style="margin:0">Dated evidence around the cut-off</h2>
              <span class="spacer"></span>
              <div class="segmented" role="group" aria-label="Time range">
                <button type="button" :aria-pressed="ui.zoom === '1y'" @click="ui.zoom = '1y'">1 year</button>
                <button type="button" :aria-pressed="ui.zoom === '5y'" @click="ui.zoom = '5y'">5 years</button>
                <button type="button" :aria-pressed="ui.zoom === 'all'" @click="ui.zoom = 'all'">All</button>
              </div>
            </div>
            <timeline-chart v-if="timeline && timeline.marks.length" :result="result" :cutoff="selected.cutoff" :zoom="ui.zoom" :compact="false" :version="version" :selected="ui.selectedSource" :show-legend="true" @open="openMark"></timeline-chart>
            <p v-else class="muted">{{ result.running ? 'The timeline fills in as dates arrive.' : 'No dated evidence in this range.' }}</p>
            <p class="small muted" style="margin-top:10px">Hover over or focus a mark to see its date and source; select it to open the evidence row. The shaded area is after the cut-off.</p>
          </div>
        </section>

        <!-- ---------- Evidence ---------- -->
        <section v-else-if="ui.tab === 'evidence'" id="panel-evidence" role="tabpanel" aria-labelledby="tab-evidence">
          <div class="panel">
            <h2>Why this grade</h2>
            <div v-if="result.running" class="muted">The grade is set when all modules have finished.</div>
            <template v-else>
              <div v-for="(pf, i) in grade.perFeature" :key="i" style="margin-bottom:12px">
                <div class="row"><span class="grade-chip" :class="'g-' + pf.grade">{{ pf.grade }}</span><strong>Feature {{ i + 1 }}:</strong> <span>{{ pf.feature }}</span></div>

              <p class="small muted">Counted: {{ countedSummary }}. Not counted: {{ excludedSummary }}.</p>
            </template>
          </div>

          <div class="panel">
            <div class="filters">
              <h2 style="margin:0">Evidence table</h2>
              <span class="spacer"></span>
              <label for="ev-filter" class="sr-only">Show</label>
              <select id="ev-filter" v-model="ui.evidenceFilter" style="width:auto">

                <option value="after">After the cut-off</option>
              </select>
            </div>
            <p class="small muted" style="margin-bottom:10px" v-if="uncheckedCount">{{ uncheckedCount }} further Internet Archive capture{{ uncheckedCount === 1 ? '' : 's' }} of the reference {{ uncheckedCount === 1 ? 'was' : 'were' }} listed but not read. They appear on the timeline and can be checked under Feature match.</p>
            <div class="table-wrap" v-if="evidenceRows.length">
              <table>
                <thead>
                  <tr><th scope="col">Source</th><th scope="col">Dated by</th><th scope="col">Class</th><th scope="col">Date (UTC)</th><th scope="col">Before cut-off</th><th scope="col">Feature</th><th scope="col">Link</th></tr>
                </thead>
                <tbody>
                  <tr v-for="row in evidenceRows" :key="row.id" :id="'row-' + cssId(row.id)" tabindex="-1" :class="{ selected: ui.selectedSource === row.id, after: !row.s.before }">
                    <td>{{ row.s.label }}<span v-if="row.s.aiFound" class="tag ai" style="margin-left:6px">Found by AI, verified by the tool</span><span class="sub" v-if="row.s.note">{{ row.s.note }}</span><span class="sub" v-if="row.s.linkedUrl">Links to {{ shortUrl(row.s.linkedUrl) }}</span></td>
                    <td>{{ row.s.party }}</td>
                    <td>{{ CLASS_TEXT[row.s.cls] }}</td>
                    <td class="num" :title="local(row.s.date) + ' your time'">{{ fmt(row.s.date) }}</td>
                    <td>{{ row.s.before ? 'Yes' : 'No' }}</td>
                    <td><span v-for="(f, i) in row.feats" :key="i" class="status" style="margin-right:8px"><span class="dot" :class="f"></span>{{ row.feats.length > 1 ? (i + 1) + ': ' : '' }}{{ statusText(f) }}</span></td>
                    <td><a :href="row.s.url" target="_blank" rel="noopener noreferrer">Open</a></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p v-else class="muted">{{ result.running ? 'Rows appear as sources are found.' : 'No dated sources in this view.' }}</p>
          </div>

          <div class="grid-2">
            <div class="panel">
              <h2>Related posts to review</h2>
              <p class="small muted" style="margin-bottom:8px">Hacker News posts before the cut-off that mention the site or repository but do not show the feature. They are leads, not evidence.</p>
              <ul class="small" v-if="result.leads && result.leads.length">
                <li v-for="l in result.leads.slice(0, 12)" :key="l.url"><a :href="l.url" target="_blank" rel="noopener noreferrer">{{ l.label }}</a>, <span class="num">{{ day(l.date) }}</span></li>
              </ul>
              <p v-else class="small">None found.</p>
            </div>
            <div class="panel">
              <h2>Search by hand</h2>
              <p class="small muted" style="margin-bottom:8px">Ready-made searches limited to the cut-off where the site allows it. They open in a new tab; nothing is scraped.</p>
              <ul class="small" v-if="result.links && result.links.length">
                <li v-for="l in result.links" :key="l.href"><a :href="l.href" target="_blank" rel="noopener noreferrer">{{ l.label }}</a></li>
              </ul>
            </div>
          </div>

          <div class="panel" v-if="result.corroborating.length || result.candidates.length">
            <h2>Corroborating pages</h2>
            <ul class="small">
              <li v-for="e in result.corroborating" :key="'c' + e.url">{{ e.url }}: {{ (e.captures || []).filter(x => x.before).length }} capture(s) before the cut-off. <span class="muted">{{ (e.notes || []).join(' ') }}</span></li>
              <li v-for="cd in result.candidates" :key="'a' + cd.url"><span class="tag ai">AI candidate</span> {{ cd.url }}: {{ candidateVerdict(cd.url) }} <span class="muted">{{ cd.notes.join(' ') }}</span></li>
            </ul>
          </div>
        </section>

        <!-- ---------- Feature match ---------- -->
        <section v-else-if="ui.tab === 'features'" id="panel-features" role="tabpanel" aria-labelledby="tab-features">
          <div class="panel">
            <h2>First capture before the cut-off showing each feature</h2>
            <ul class="small" style="padding-left:18px">
              <li v-for="(f, i) in features" :key="i"><strong>{{ f }}</strong>:
                <template v-if="firstPresent[i]"> <a :href="firstPresent[i].viewUrl" target="_blank" rel="noopener noreferrer" class="num">{{ fmt(firstPresent[i].date) }}</a> (Internet Archive)</template>
                <template v-else> not shown in any checked capture of the reference.</template>
              </li>
            </ul>
            <p class="small muted" style="margin-top:8px" v-if="result.reference.checkNotes && result.reference.checkNotes.length">{{ result.reference.checkNotes.join(' ') }}</p>
            <p class="small muted" style="margin-top:8px">Scores: lexical overlap of the feature's words (1.00 = the exact phrase). Present at {{ settings.lexicalPresent }} or above, possibly at {{ settings.lexicalPossible }} or above. You can confirm or reject any verdict; your decision changes the grade and is marked in the report.</p>
          </div>

          <div v-if="!checkedCaptures.length" class="panel muted">No archived page has been read yet.{{ result.reference.needsProxy ? ' Archived pages need a proxy in live mode (Settings).' : '' }}</div>
          <article v-for="item in checkedCaptures" :key="item.cap.rawUrl" class="capture-card">
            <header>
              <span class="date num">{{ fmt(item.cap.date) }}</span>
              <span class="pill" :class="item.cap.before ? 'done' : 'skipped'">{{ item.cap.before ? 'Before the cut-off' : 'After the cut-off' }}</span>
              <span class="small muted">{{ item.role }}<span v-if="item.cap.refined">, found while narrowing the first date</span></span>
              <span class="spacer"></span>
              <a :href="item.cap.viewUrl" target="_blank" rel="noopener noreferrer" class="small">Open capture</a>
            </header>
            <p v-if="item.cap.check.error" class="error-text">{{ item.cap.check.error }}</p>
            <template v-else>
              <p class="small muted" style="margin-bottom:8px" v-if="item.cap.check.sentenceCount">{{ item.cap.check.title || 'Untitled page' }}, {{ item.cap.check.sentenceCount }} text segments read.</p>
              <p class="small muted" style="margin-bottom:8px" v-else>The archived page has no readable text. It may be empty, or built by JavaScript that the archive did not run.</p>
              <div v-for="(fr, fi) in item.cap.check.features" :key="fi" class="feature-row">
                <div class="row">
                  <span class="status"><span class="dot" :class="P.featureStatusOf({ capture: item.cap }, fi)"></span>{{ statusText(P.featureStatusOf({ capture: item.cap }, fi)) }}</span>
                  <span v-if="item.cap.override && item.cap.override[fi]" class="tag">Set by analyst</span>
                  <span class="feature-name">Feature {{ fi + 1 }}: {{ features[fi] }}</span>
                </div>
                <ul class="sentences">
                  <li v-for="(b, bi) in fr.best" :key="bi" :class="{ top: bi === 0 }">
                    <span v-for="(part, pi) in highlightParts(b.text, b.hits)" :key="pi"><mark v-if="part.hit">{{ part.t }}</mark><template v-else>{{ part.t }}</template></span>
                    <div class="scores">Lexical {{ b.lexical.toFixed(2) }}<template v-if="b.semantic != null">, semantic {{ b.semantic.toFixed(2) }}</template></div>
                  </li>
                </ul>
                <div class="override" v-if="item.cap.before">
                  <button type="button" @click="setOverride(item.cap, fi, 'present')" :aria-pressed="!!(item.cap.override && item.cap.override[fi] === 'present')">Confirm present</button>
                  <button type="button" @click="setOverride(item.cap, fi, 'absent')" :aria-pressed="!!(item.cap.override && item.cap.override[fi] === 'absent')">Reject</button>
                  <button type="button" class="quiet" v-if="item.cap.override && item.cap.override[fi]" @click="setOverride(item.cap, fi, null)">Undo</button>
                </div>
              </div>
            </template>
          </article>

          <div class="panel" v-if="uncheckedCaptures.length" style="margin-top:16px">
            <h2>Other captures before the cut-off ({{ uncheckedCaptures.length }})</h2>
            <p class="small muted" style="margin-bottom:8px">Check any of them to read it for the features.<template v-if="mode === 'demo'"> In demo mode only cached captures can be read.</template><template v-else-if="!settings.proxyPrefix"> Reading archived pages in live mode needs a proxy (Settings).</template></p>
            <div class="table-wrap" style="max-height:320px;overflow:auto">
              <table>
                <thead><tr><th scope="col">Captured (UTC)</th><th scope="col">Address</th><th scope="col"></th></tr></thead>
                <tbody>
                  <tr v-for="cap in uncheckedCaptures" :key="cap.ts">
                    <td class="num">{{ fmt(cap.date) }}</td>
                    <td class="small">{{ cap.original }}</td>
                    <td>
                      <button v-if="!checkBlocked(cap)" type="button" :disabled="cap.checking" @click="checkCapture(cap)">{{ cap.checking ? 'Reading…' : 'Check' }}</button>
                      <span v-else class="small muted">{{ checkBlocked(cap) }}</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ---------- Report ---------- -->
        <section v-else-if="ui.tab === 'report'" id="panel-report" role="tabpanel" aria-labelledby="tab-report">
          <div class="report-actions">
            <button type="button" class="primary" :disabled="result.running" @click="printReport">Print or save as PDF</button>
            <button type="button" @click="exportJson">Export JSON</button>
            <button type="button" :disabled="!!ui.aiBusy || result.running" @click="runAiTask('summary')">{{ ui.aiBusy === 'summary' ? 'Drafting…' : 'Draft a summary with AI' }}</button>
          </div>
          <p v-if="ui.aiError" class="error-text no-print" role="alert">{{ ui.aiError }}</p>
          <div v-if="ui.summaryProblems.length" class="notice no-print" style="margin-bottom:12px">
            The AI draft was rejected: {{ ui.summaryProblems.join('; ') }}.
          </div>
          <article class="report" v-if="!result.running">
            <h1>Prior-art date dossier: {{ selected.name }}</h1>
            <p class="lead">Generated {{ fmt(reportGeneratedAt) }} by Prior-Art Date Verifier v{{ appVersion }} using {{ result.mode === 'demo' ? 'responses cached on ' + demoCaptured + ' (demo mode)' : 'live requests' }}.</p>

            <h2>1. Case summary</h2>
            <dl>
              <dt>Reference</dt><dd><a :href="result.url" target="_blank" rel="noopener noreferrer">{{ result.url }}</a> ({{ typeName(result.type) }})</dd>
              <dt v-if="selected.patentNo">Patent</dt><dd v-if="selected.patentNo">{{ selected.patentNo }}</dd>
              <dt>Features</dt><dd><ol style="margin:0;padding-left:18px"><li v-for="(f, i) in features" :key="i">{{ f }}</li></ol></dd>
            </dl>

            <h2>2. Cut-off date</h2>
            <p><span class="num">{{ selected.cutoff }}</span>. {{ selected.countOnCutoff ? 'Captures made on the cut-off date were counted as before it.' : 'Only evidence strictly before the cut-off date (00:00 UTC) was counted.' }}</p>

            <h2>3. Verdict</h2>
            <p><strong>Grade {{ grade.grade }}: {{ P.GRADE_TEXT[grade.grade] }}.</strong> {{ grade.reason }}</p>
            <p v-if="grade.keyDate" style="margin-top:6px">Earliest dated evidence: <strong class="num">{{ fmt(grade.keyDate) }}</strong>.</p>
            <ul class="small" style="margin-top:8px">
              <li v-for="(pf, i) in grade.perFeature" :key="i">Feature {{ i + 1 }}, grade {{ pf.grade }}: {{ pf.rule }}</li>
            </ul>
            <p class="small" v-if="overrideCount" style="margin-top:6px">{{ overrideCount }} verdict{{ overrideCount === 1 ? ' was' : 's were' }} set by the analyst and {{ overrideCount === 1 ? 'is' : 'are' }} marked in the table.</p>
            <template v-if="ui.summaryDraft">
              <div class="ai-box" style="margin-top:12px">
                <div class="ai-label">AI-drafted summary – review before use</div>
                <label for="summary-edit" class="sr-only">Edit the AI-drafted summary</label>
                <textarea id="summary-edit" v-model="ui.summaryDraft" rows="6" style="margin-top:6px"></textarea>
              </div>
            </template>

            <h2>4. Timeline</h2>
            <timeline-chart v-if="reportTimeline && reportTimeline.marks.length" :result="result" :cutoff="selected.cutoff" zoom="5y" :compact="false" :version="version" :selected="null" :show-legend="true" @open="() => {}"></timeline-chart>

            <h2>5. Evidence table</h2>
            <div class="table-wrap">
              <table>
                <thead><tr><th scope="col">Source</th><th scope="col">Type</th><th scope="col">Class</th><th scope="col">Date (UTC)</th><th scope="col">Before</th><th scope="col">Feature</th><th scope="col">Link</th></tr></thead>
                <tbody>
                  <tr v-for="row in reportRows" :key="row.id">
                    <td>{{ row.s.label }}{{ row.s.aiFound ? ' (found by AI, verified by the tool)' : '' }}</td>
                    <td>{{ row.s.party }}</td>
                    <td>{{ CLASS_TEXT[row.s.cls] }}</td>
                    <td class="num">{{ fmt(row.s.date) }}</td>
                    <td>{{ row.s.before ? 'Yes' : 'No' }}</td>
                    <td>{{ row.feats.map((f, i) => (row.feats.length > 1 ? (i + 1) + ': ' : '') + statusText(f) + (row.over[i] ? ' (analyst)' : '')).join(', ') }}</td>
                    <td class="small" style="word-break:break-all">{{ row.s.url }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p class="small muted" style="margin-top:6px" v-if="uncheckedCount">Not listed: {{ uncheckedCount }} capture{{ uncheckedCount === 1 ? '' : 's' }} that the tool listed but did not read.</p>

            <h2>6. Matched text</h2>
            <div v-for="(ex, i) in reportExcerpts" :key="i" style="margin-bottom:10px">
              <p><strong>Feature {{ i + 1 }}:</strong> {{ ex.feature }}</p>
              <div v-for="(it, j) in ex.items" :key="j" class="quote">“{{ it.text }}”<div class="small muted">{{ it.role }}, captured {{ fmt(it.date) }}: {{ it.url }}</div></div>
              <p v-if="!ex.items.length" class="small muted">No archived capture before the cut-off shows this feature.</p>
            </div>

            <h2>7. Method</h2>
            <ul class="small">
              <li>Captures of the reference were listed with the Internet Archive CDX index{{ result.reference.method === 'availability' ? ' (sampled through the availability API because the index could not be reached)' : '' }}, one per month up to the cut-off and a few after it.</li>
              <li>Up to {{ settings.capturesToCheck }} captures before the cut-off were read as raw archived HTML (the id_ form, without the archive's toolbar). Scripts and navigation were removed; only text was kept.</li>
              <li v-if="settings.refineFirstDate">The first capture showing the features was narrowed by checking captures between the last one without them and the first one with them.</li>
              <li>Each feature was scored against every sentence by word overlap{{ settings.semantic ? ' and by sentence embeddings (all-MiniLM-L6-v2)' : '' }}.</li>
              <li>Platform dates (GitHub, YouTube), Software Heritage visits and Hacker News posts were added where relevant.</li>
              <li>Grades: A, two or more independent dating parties before the cut-off and the feature present in one of them; B, one independent or platform-dated source showing the feature; C, only self-reported dates; D, nothing shows the feature before the cut-off. With several features the weakest grade applies.</li>
              <li>AI suggestions, if any, were not counted. Only pages the tool verified itself can count.</li>
            </ul>

            <h2>8. Limitations</h2>
            <ul class="small"><li v-for="(l, i) in LIMITATIONS" :key="i">{{ l }}</li></ul>

            <h2>9. Record</h2>
            <p class="small">Generated {{ fmt(reportGeneratedAt) }}, tool version {{ appVersion }}, {{ result.mode === 'demo' ? 'demo data cached on ' + demoCaptured : 'live data' }}.</p>
          </article>
        </section>
      </template>
    </main>
  </div>

  <!-- ============ Settings ============ -->
  <div v-if="ui.modal === 'settings'" class="modal-backdrop" @click.self="ui.modal = null" @keydown.esc="ui.modal = null">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head"><h2 id="settings-title">Settings</h2><span class="spacer"></span><button type="button" class="quiet" @click="ui.modal = null" v-focus>Close</button></div>
      <div class="modal-body">
        <div class="settings-group">
          <h3>Archive access</h3>
          <div class="field">
            <label for="s-proxy">CORS proxy prefix</label>
            <input id="s-proxy" type="url" v-model.trim="settings.proxyPrefix" placeholder="https://your-worker.workers.dev/?url=" spellcheck="false">
            <div class="hint">web.archive.org does not allow requests from web pages. Deploy the included cors-proxy-worker.js (it forwards only to the archive hosts) and paste its address followed by ?url=. The target URL is added, encoded, at the end.</div>
          </div>
        </div>
        <div class="settings-group">
          <h3>Matching</h3>
          <div class="fields-2">
            <div class="field"><label for="s-lp">Lexical score for present</label><input id="s-lp" type="number" min="0" max="1" step="0.05" v-model.number="settings.lexicalPresent"></div>
            <div class="field" style="margin-top:0"><label for="s-lq">Lexical score for possibly present</label><input id="s-lq" type="number" min="0" max="1" step="0.05" v-model.number="settings.lexicalPossible"></div>
            <div class="field" style="margin-top:0"><label for="s-sp">Semantic score for present</label><input id="s-sp" type="number" min="0" max="1" step="0.05" v-model.number="settings.semanticPresent"></div>
            <div class="field" style="margin-top:0"><label for="s-sq">Semantic score for possibly present</label><input id="s-sq" type="number" min="0" max="1" step="0.05" v-model.number="settings.semanticPossible"></div>
            <div class="field" style="margin-top:0"><label for="s-n">Captures to read per case</label><input id="s-n" type="number" min="1" max="12" step="1" v-model.number="settings.capturesToCheck"></div>
          </div>
          <label class="check-label" style="margin-top:12px"><input type="checkbox" v-model="settings.refineFirstDate"><span>Narrow down the first date that shows the features (reads up to 8 more captures)</span></label>
          <label class="check-label" style="margin-top:8px"><input type="checkbox" v-model="settings.semantic"><span>Semantic matching with a small model (about 23 MB, downloaded from the Hugging Face hub the first time; it took about 13 seconds in testing)</span></label>
          <p class="hint">In demo mode the cached run always uses the default capture settings and lexical matching, so that every request is in the cache.</p>
        </div>
        <div class="settings-group">
          <h3>YouTube</h3>
          <div class="field"><label for="s-yt">YouTube Data API key</label><input id="s-yt" type="password" v-model.trim="settings.youtubeKey" autocomplete="off" spellcheck="false"></div>
          <label class="check-label" style="margin-top:8px"><input type="checkbox" v-model="settings.rememberYoutubeKey"><span>Remember on this device</span></label>
          <p class="hint">Restrict the key to your site's address (HTTP referrer) in Google Cloud Console.</p>
        </div>
        <div class="settings-group">
          <h3>AI fallback (Google Gemini)</h3>
          <p class="notice" style="margin-bottom:12px">{{ CONFIDENTIAL_NOTICE }}</p>
          <div class="field"><label for="s-gem">Gemini API key</label><input id="s-gem" type="password" v-model.trim="settings.geminiKey" autocomplete="off" spellcheck="false"></div>
          <label class="check-label" style="margin-top:8px"><input type="checkbox" v-model="settings.rememberGeminiKey"><span>Remember on this device</span></label>
          <div class="field" style="margin-top:12px"><label for="s-model">Model ID</label><input id="s-model" type="text" v-model.trim="settings.geminiModel" spellcheck="false"></div>
          <label class="check-label" style="margin-top:12px"><input type="checkbox" v-model="settings.useGrounding"><span>Use Google Search grounding when looking for other publications</span></label>
          <label class="check-label" style="margin-top:8px"><input type="checkbox" v-model="settings.autoAI"><span>Run the AI automatically when a module fails or finds nothing</span></label>
          <label class="check-label" style="margin-top:8px"><input type="checkbox" v-model="settings.previewAI"><span>Show what will be sent before each AI call</span></label>
          <div class="field" style="margin-top:12px"><label for="s-max">Most sentences sent to the AI per request</label><input id="s-max" type="number" min="10" max="200" step="10" v-model.number="settings.aiMaxSentences" style="max-width:160px"></div>
          <p class="hint">The key is sent only to generativelanguage.googleapis.com, in a request header. Restrict it to the Generative Language API and to your site's address in Google Cloud Console.</p>
        </div>
      </div>
      <div class="modal-foot"><button type="button" @click="resetSettings">Restore defaults</button><button type="button" class="primary" @click="ui.modal = null">Done</button></div>
    </div>
  </div>

  <!-- ============ Request log ============ -->
  <div v-if="ui.modal === 'log'" class="modal-backdrop" @click.self="ui.modal = null" @keydown.esc="ui.modal = null">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="log-title">
      <div class="modal-head"><h2 id="log-title">Request log</h2><span class="small muted">{{ logs.length }} requests, newest first</span><span class="spacer"></span><button type="button" @click="clearLog">Clear</button><button type="button" class="quiet" @click="ui.modal = null" v-focus>Close</button></div>
      <div class="modal-body">
        <p v-if="!logs.length" class="muted">No requests yet. Run a check to see each call here.</p>
        <div class="table-wrap" v-else>
          <table>
            <thead><tr><th scope="col">Time</th><th scope="col">What</th><th scope="col">URL</th><th scope="col">Status</th><th scope="col">ms</th><th scope="col">Source</th></tr></thead>
            <tbody>
              <tr v-for="e in logs.slice(0, 300)" :key="e.id">
                <td class="num small">{{ e.at.slice(11, 19) }}</td>
                <td class="small">{{ e.label }}</td>
                <td class="small" style="word-break:break-all;max-width:460px">{{ e.method !== 'GET' ? e.method + ' ' : '' }}{{ e.url }}<span class="sub" v-if="e.note">{{ e.note }}</span></td>
                <td class="num">{{ e.status }}</td>
                <td class="num">{{ e.ms }}</td>
                <td><span class="tag" :class="{ demo: e.via === 'cached' }">{{ e.via || 'failed' }}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ About ============ -->
  <div v-if="ui.modal === 'about'" class="modal-backdrop" @click.self="ui.modal = null" @keydown.esc="ui.modal = null">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="modal-head"><h2 id="about-title">About this tool</h2><span class="spacer"></span><button type="button" class="quiet" @click="ui.modal = null" v-focus>Close</button></div>
      <div class="modal-body stack">
        <p>Finding a technically matching web page, video or repository is often quick. Proving that it was public before the patent's cut-off date is slower: an analyst checks archives, changelogs and posts one by one. This tool does the first pass and assembles a dated evidence dossier. The analyst makes the final judgement.</p>
